name: Android APK (offline)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-v*.html'
      - 'index.html'
      - 'assets/**'
      - 'presets/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app-v*.html'
      - 'index.html'
      - 'assets/**'
      - 'presets/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    name: Compilar Poker Blitz Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Los runners ubuntu-latest ya incluyen Android SDK y sdkmanager.
      # setup-android@v3 intenta instalar el paquete obsoleto "tools" y falla.
      - name: Instalar plataforma Android 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK sin servicios online
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Blitz-V1-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Probar que Poker Blitz inicia en Android, no solo que compila
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.magalarza.pokerblitz/.MainActivity
            for i in $(seq 1 40); do
              if adb logcat -d -s PokerBlitzBoot:I | grep -q 'POKER_BLITZ_READY:home'; then
                echo "La pantalla principal de Poker Blitz inició correctamente en el WebView."
                exit 0
              fi
              if adb logcat -d -s PokerBlitzBoot:E | grep -q 'POKER_BLITZ_ERROR:'; then
                echo "Se detectó error de JavaScript en el arranque:"
                adb logcat -d -s PokerBlitzBoot:V chromium:E AndroidRuntime:E | tail -n 150
                exit 1
              fi
              sleep 2
            done
            echo "Fallo: Poker Blitz sigue en la pantalla de carga."
            adb logcat -d -s PokerBlitzBoot:V chromium:E AndroidRuntime:E | tail -n 200
            exit 1

