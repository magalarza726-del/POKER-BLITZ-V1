name: Android APK (offline)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-v*.html'
      - 'index.html'
      - 'assets/**'
      - 'presets/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'app-v*.html'
      - 'index.html'
      - 'assets/**'
      - 'presets/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    name: Compilar Poker Blitz Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Los runners ubuntu-latest ya incluyen Android SDK y sdkmanager.
      # setup-android@v3 intenta instalar el paquete obsoleto "tools" y falla.
      - name: Instalar plataforma Android 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK sin servicios online
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Validar los scripts de la aplicación offline
        run: python3 android/tools/verify_offline_web.py
      - name: Probar reglas manuales, CounterCards, cobros y reacción
        run: node android/tools/check_manual_rules.js
      - name: Probar motor de efectos asistidos y los tres modos de prueba
        run: node android/tools/check_assisted_effects.js
      - name: Verificar la vista Android en Chrome horizontal
        run: python3 android/tools/check_mobile_layout.py
      - name: Verificar Prueba Manual Sencillo y Prueba Asistida en Chrome
        run: python3 android/tools/check_test_modes.py
      - name: Verificar que Robar, Intercambiar y Descartar figuren en PDF real
        run: |
          python3 -m pip install "pypdf>=5,<7"
          python3 android/tools/check_manual_actions_pdf.py
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Poker-Blitz-V1-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
