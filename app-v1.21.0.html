  async function runTraining(){
    if(trainingBusy)return;
    const trainer=window.POKER_BLITZ_TRAINING;
    if(!trainer){toast('Módulo de entrenamiento no disponible. Recarga la aplicación.');return;}
    const original=availableTestDecks().find(d=>d.id===trainingSettings.deckId);
    if(!original){toast('Selecciona un deck que cumpla el reglamento oficial.');return;}
    const snapshot=structuredClone(original),all=availableTestDecks().map(d=>structuredClone(d));
    const fp=trainer.fingerprint(snapshot),seed=generateSeed();
    trainingBusy=true;trainingCancel={cancelled:false};trainingResult=null;
    trainingProgress={phase:'I',percent:0,step:0,message:'Preparando las manos de 2 a 7 Power Cards…',accepts:0};
    render();
    try{
      const engine=makeAutoEngine();
      const result=await trainer.train({deck:snapshot,decks:all,iterations:trainingSettings.iterations,seed,getCard,
       engine,cancel:trainingCancel,progress:data=>{
         trainingProgress=data;
         if(screen==='training'&&(data.step===data.total||data.step%Math.max(1,Math.ceil(data.total/30))===0||data.phase==='DONE'))render();
       }});
      const live=getDeck(original.id);
      if(!live||trainer.fingerprint(live)!==fp){
        trainingResult=result;toast('El deck cambió durante el entrenamiento. No se guardó una política para otra versión.');
      }else{
        live.aiTrainingHistory??=[];
        if(live.aiTraining)live.aiTrainingHistory.push(live.aiTraining);
        live.aiTrainingHistory=live.aiTrainingHistory.slice(-8);
        live.aiTraining=result;
        trainingResult=result;
        if(!saveState())toast('No se pudo guardar la política. Exporta tu JSON como respaldo.');
        else toast(result.accepted?'IA entrenada y guardada para esta versión.':'Entrenamiento terminado. Se conserva la mejor política verificada.');
      }
    }catch(err){
      if(!err?.cancelled){console.error('Entrenamiento',err);toast('Error durante entrenamiento: '+String(err?.message||err));}
      else toast('Entrenamiento cancelado. El deck y la política anterior se conservan.');
    }finally{trainingBusy=false;trainingCancel=null;if(screen==='training')render();}
  }

  async function runDeckLaboratory(mode){
    if(labBusy)return;syncLabSettings();
    const legalDecks=availableTestDecks(),selected=legalDecks.find(d=>d.id===labSettings.deckId);
    const rivals=labSettings.opponentIds.slice(0,labSettings.players-1).map(id=>legalDecks.find(d=>d.id===id)).filter(Boolean);
    if(rivals.length!==labSettings.players-1||!rivals.length)return toast('Escoge rivales legales para todos los puestos.');
    if(mode==='improve'&&!selected)return toast('El deck original debe cumplir el reglamento.');
    let seed;try{seed=parseSeed(labSettings.seedInput)??generateSeed()}catch(err){return toast(String(err.message||err))}
    labBusy=true;labCancel={cancelled:false};labResult=null;labProgress={message:'Preparando partidas y semillas reproducibles…'};render();
    try{
      const engine=makeAutoEngine();
      const ctx={engine,cancel:labCancel,games:labSettings.games,seed,pokerDeckCount:labSettings.players>7?2:1,
        maxRounds:40,onProgress:data=>{
          labProgress={message:'Versión '+data.iteration+'/'+data.total+
             ' · Mejor evaluación: '+(data.best?.wins??0)+' V, '+(data.best?.losses??0)+' D.'};
          if(screen==='deckImprove'||screen==='deckCreate')render();
        }};
      const type=id=>cardType(getCard(id)),catalog=state.cards.filter(c=>officialCardIds.has(c.id));
      const settings={...labSettings,seed};
      if(mode==='improve'){
        const original=selected.optimizationOrigin||{cardIds:[...selected.cardIds],hyperCardIds:[...selected.hyperCardIds]};
        const result=await window.POKER_BLITZ_DECK_LAB.improve(selected,rivals,catalog,type,settings,{...ctx,original});
        if(!labCancel.cancelled){
          selected.optimizationOrigin??={cardIds:[...original.cardIds],hyperCardIds:[...original.hyperCardIds]};
          selected.versionHistory??=[];
          for(const trial of result.trials)selected.versionHistory.push({...trial,mode:'improve',createdAt:new Date().toISOString()});
          selected.versionHistory=selected.versionHistory.slice(-180);
          selected.cardIds=[...result.best.cardIds];selected.hyperCardIds=[...result.best.hyperCardIds];
          if(!deckIsLegal(selected))throw Error('El motor devolvió un deck ilegal.');
          saveState();labResult={mode,metrics:result.bestMetrics,similarity:result.similarity,count:result.trials.length,saved:true,deckId:selected.id};
        }else labResult={mode,metrics:result.bestMetrics,similarity:result.similarity,count:result.trials.length,saved:false};
      }else{
        const result=await window.POKER_BLITZ_DECK_LAB.create(catalog,rivals,type,settings,ctx);
        if(result.best&&!labCancel.cancelled){
          const deck={id:crypto.randomUUID(),name:'Generado · '+labSettings.style+' · '+new Date().toLocaleDateString(),
            description:'Deck creado por simulaciones. Agresividad '+labSettings.aggression+'/5; facilidad '+labSettings.ease+'.',
            ...result.best,characterImage:null,characterScale:1,characterFocusX:50,characterFocusY:50,
            versionHistory:result.history.map(item=>({...item,mode:'create',createdAt:new Date().toISOString()}))};
          if(!deckIsLegal(deck))throw Error('El generador devolvió un deck ilegal.');
          state.decks.push(deck);saveState();
          labResult={mode,metrics:result.metrics,count:result.history.length,saved:true,deckId:deck.id};
        }else labResult={mode,metrics:result.metrics,count:result.history.length,saved:false};
      }
      labProgress={message:labCancel.cancelled?'Se canceló: el deck existente no se modificó.':'Evaluación terminada; versiones guardadas.'};
    }catch(err){
      console.error('Laboratorio de decks',err);
      labProgress={message:'Error: '+String(err.message||err)};
      toast(labProgress.message);
    }finally{labBusy=false;labCancel=null;render();}
  }

  function syncLabSettings(){
    const decks=availableTestDecks();
    if(!decks.some(d=>d.id===labSettings.deckId))labSettings.deckId=decks[0]?.id||'';
    labSettings.players=Math.min(10,Math.max(2,Number(labSettings.players)||4));
    labSettings.games=Math.min(40,Math.max(2,Number(labSettings.games)||4));
    labSettings.iterations=Math.min(80,Math.max(1,Number(labSettings.iterations)||12));
    for(let i=0;i<labSettings.players-1;i++)
      if(!decks.some(d=>d.id===labSettings.opponentIds[i]&&d.id!==labSettings.deckId))
        labSettings.opponentIds[i]=decks.find(d=>d.id!==labSettings.deckId)?.id||'';
  }

<button class="btn" style="height:64px" data-action="export-json">${icon('upload')} Exportar JSON</button><button class="btn" style="height:64px" data-action="import-json">${icon('download')} Importar JSON</button></div></div></div></section></main>`;

  // Global manual exchange — simulator state is authoritative, not DOM.

  function openTrade(){
    if(!sim?.decks?.length)return;
    const from=sim.decks[sim.activeIndex].id;
    const to=sim.decks.find(d=>d.id!==from)?.id||null;
    modal={type:'trade',from,to,kind:'POKER',operation:to?'SWAP':'DISCARD',
      visibility:{from:'VISIBLE',to:'VISIBLE'},picked:null};
    render();
  }
  function updateTradeView(){
    const scroll=Object.fromEntries(['from','to'].map(side=>[side,document.querySelector('[data-trade-list="'+side+'"]')?.scrollTop||0]));
    render();
    for(const side of ['from','to']){
      const list=document.querySelector('[data-trade-list="'+side+'"]');
      if(list)list.scrollTop=scroll[side];
    }
  }
  function tradeHandMarkup(playerId,side){
    const s=sim?.states?.[playerId];
    if(!s)return '<div class="history-empty">Sin jugador asignado.</div>';
    const poker=modal.kind==='POKER',hidden=modal.visibility[side]==='HIDDEN';
    const cards=poker?(s.pokerHand||[]):(s.hand||[]);
    if(!cards.length)return '<div class="history-empty">No hay cartas en esta mano.</div>';
    return cards.map((entry,i)=>{
      const locked=!poker&&(s.activeHyper||[]).includes(i);
      const power=poker?null:getCard(entry);
      const name=poker?(entry.rank+' de '+entry.suit):(power?.name||'Power Card');
      const face=poker?pokerCardHTML(entry):power?cardHTML(power):'';
      const back='<div class="trade-back '+(poker?'poker':'')+'" aria-hidden="true"><span>♠</span><strong>POKER BLITZ</strong></div>';
      const label=locked?'Hyper activa · bloqueada':hidden?('Carta '+(i+1)):name;
      const selected=modal.picked?.side===side&&modal.picked.index===i;
      return '<button type="button" class="trade-tile '+(selected?'selected':'')+'" data-action="trade-pick" data-side="'+side+'" data-index="'+i+'" '+(locked?'disabled':'')+' aria-pressed="'+selected+'" aria-label="'+esc(hidden?('Carta '+(i+1)):name)+'"><div class="trade-preview">'+(hidden?back:face)+'</div><span class="trade-tile-label">'+esc(label)+'</span></button>';
    }).join('');
  }
  function tradeModalMarkup(){
    if(!sim?.decks?.length)return '';
    const ids=sim.decks.map(d=>d.id);
    if(!ids.includes(modal.from))modal.from=ids[0];
    if(!ids.includes(modal.to)||modal.to===modal.from)modal.to=ids.find(id=>id!==modal.from)||null;
    const poker=modal.kind==='POKER';
    const operation=modal.operation||'SWAP';
    function column(side,playerId){
      const st=sim.states[playerId],count=st?(poker?(st.pokerHand||[]).length:(st.hand||[]).length):0;
      const options=sim.decks.map(d=>'<option value="'+esc(d.id)+'" '+(d.id===playerId?'selected':'')+'>Jugador '+d.playerNumber+' · '+esc(d.name)+'</option>').join('');
      const hidden=modal.visibility[side]==='HIDDEN';
      const reveal='<div class="trade-reveal" aria-label="Visibilidad del jugador '+(side==='from'?'A':'B')+'"><button type="button" class="'+(!hidden?'active':'')+'" data-action="trade-visibility" data-side="'+side+'" data-visibility="VISIBLE" aria-pressed="'+!hidden+'">👁 Visible</button><button type="button" class="'+(hidden?'active':'')+'" data-action="trade-visibility" data-side="'+side+'" data-visibility="HIDDEN" aria-pressed="'+hidden+'">▣ Reverso</button></div>';
      const receive=operation==='STEAL'&&st?'<button class="trade-receive" data-action="trade-receive" data-side="'+side+'">↓ Soltar aquí para robar</button>':'';
      const playerSelect=st?'<select id="trade-'+side+'" data-trade-player="'+side+'">'+options+'</select>':'<p class="trade-notice">Añade otro jugador para Robar o Intercambiar.</p>';
      return '<section class="trade-panel" data-trade-panel="'+side+'"><div class="trade-panel-head"><label for="trade-'+side+'">Jugador '+(side==='from'?'A':'B')+'</label>'+playerSelect+reveal+'<small>'+(poker?'Poker Hand':'Power Hand')+' · '+count+' cartas'+(poker?'':' (Hyper activas bloqueadas)')+'</small>'+receive+'</div><div class="trade-list" data-trade-list="'+side+'">'+tradeHandMarkup(playerId,side)+'</div></section>';
    }
    function tab(action,key,value,title,selected){return '<button type="button" class="'+(selected?'active':'')+'" data-action="'+action+'" data-'+key+'="'+value+'" aria-pressed="'+selected+'">'+title+'</button>';}
    const instructions=operation==='STEAL'?'Robar: lleva una carta de una mano a la otra, sin devolver otra carta. Puedes soltarla en cualquier zona del jugador que recibe.':operation==='DISCARD'?'Descartar: arrastra una carta al tacho de basura. Poker vuelve al mazo compartido; Power vuelve al mazo del jugador.':'Intercambiar: arrastra una carta sobre una carta del otro jugador; se permutan ambas.';
    return '<div class="modal-backdrop"><div class="modal trade-modal" role="dialog" aria-modal="true" aria-label="Acciones manuales entre jugadores">'+
      '<div class="modal-head"><h2>⚙ Acciones manuales</h2><button class="icon-btn" data-action="close-modal" aria-label="Cerrar">'+icon('close')+'</button></div>'+
      '<div class="trade-toolbar"><div class="trade-tabs" aria-label="Tipo de mano">'+tab('trade-kind','kind','POKER','Poker Hands',poker)+tab('trade-kind','kind','POWER','Power Hands',!poker)+'</div>'+
      '<div class="trade-tabs" aria-label="Operación">'+tab('trade-operation','operation','STEAL','↪ Robar',operation==='STEAL')+tab('trade-operation','operation','SWAP','⇄ Intercambiar',operation==='SWAP')+tab('trade-operation','operation','DISCARD','🗑 Descartar',operation==='DISCARD')+'</div></div>'+

      '</div></div>';
  }
  function tradeApply(sourceSide,sourceIndex,targetSide=null,targetIndex=null){
    if(!sim||modal?.type!=='trade'||!['from','to'].includes(sourceSide))return false;
    const operation=modal.operation||'SWAP',poker=modal.kind==='POKER',key=poker?'pokerHand':'hand';
    const srcId=modal[sourceSide],a=sim.states[srcId];
    if(!a||!Number.isInteger(sourceIndex)||sourceIndex<0||sourceIndex>=a[key].length)return false;
    if(!poker&&(a.activeHyper||[]).includes(sourceIndex)){toast('No puedes mover una HyperCard activa');return false;}
    if(operation!=='DISCARD'&&(!['from','to'].includes(targetSide)||targetSide===sourceSide)){toast('Elige otro jugador');return false;}
    const destId=operation==='DISCARD'?null:modal[targetSide],b=destId?sim.states[destId]:null;
    if(operation!=='DISCARD'&&(!b||destId===srcId))return false;
    if(operation==='SWAP'){
      if(!Number.isInteger(targetIndex)||targetIndex<0||targetIndex>=b[key].length)return false;
      if(!poker&&(b.activeHyper||[]).includes(targetIndex)){toast('No puedes intercambiar una HyperCard activa');return false;}
    }
    if(poker){
      const src=a.pokerHand[sourceIndex],dest=b?.pokerHand?.[targetIndex];
      const locked=(pid,card)=>card&&((sim.states[pid]?.manualEnchantedIds||[]).includes(card.id)||(sim.mode==='ASSISTED'&&assistedLinks.protectedCard(pid,card)));
      if(locked(srcId,src)||dest&&destId&&locked(destId,dest)){toast('Esa Poker Card está encantada y protegida.');return false;}
    }
    if(!poker){manualRules.own(srcId);if(destId)manualRules.own(destId)}
    const first=a[key][sourceIndex],second=operation==='SWAP'?b[key][targetIndex]:null;
    const firstOwner=poker?null:a.handOwners[sourceIndex],secondOwner=poker||operation!=='SWAP'?null:b.handOwners[targetIndex];
    if(!first||(operation==='SWAP'&&!second))return false;
    const affected=destId?[srcId,destId]:[srcId];
    pushUndo(sim.decks[sim.turnIndex].id,'Acción manual: '+operation);
    const states=Object.fromEntries(affected.map(id=>[id,structuredClone(sim.states[id])]));
    const lengths=Object.fromEntries(affected.map(id=>[id,(sim.histories[id]||[]).length]));
    const oldPile=structuredClone(sim.pokerDrawPile||[]),oldResult=sim.result;
    // Las operaciones entre jugadores conservan la cadena de deshacer del turno.
    if(operation==='SWAP'){
      [a[key][sourceIndex],b[key][targetIndex]]=[second,first];
      if(!poker)[a.handOwners[sourceIndex],b.handOwners[targetIndex]]=[secondOwner,firstOwner];
    }else{
      a[key].splice(sourceIndex,1);
      if(!poker)a.handOwners.splice(sourceIndex,1);
      if(!poker)a.activeHyper=(a.activeHyper||[]).filter(i=>i!==sourceIndex).map(i=>i>sourceIndex?i-1:i);
      if(operation==='STEAL'){b[key].push(first);if(!poker)b.handOwners.push(firstOwner||srcId)}
      else if(poker)sim.pokerDrawPile=shuffle([...sim.pokerDrawPile,first]);
      else manualRules.giveBack(first,firstOwner||srcId);
    }
    const playerA=sim.decks.find(d=>d.id===srcId),playerB=destId?sim.decks.find(d=>d.id===destId):null;
    const masked=modal.visibility[sourceSide]==='HIDDEN'||(targetSide&&modal.visibility[targetSide]==='HIDDEN');
    const label=(card)=>masked?'carta oculta':poker?(card.rank+' de '+card.suit):(getCard(card)?.name||'Power Card');
    const type=poker?'Poker Card':'Power Card';
    const desc=operation==='SWAP'?'J'+playerA.playerNumber+' ⇄ J'+playerB.playerNumber+': '+label(first)+' por '+label(second)+'.':operation==='STEAL'?'J'+playerB.playerNumber+' roba de J'+playerA.playerNumber+': '+label(first)+'.':'J'+playerA.playerNumber+' descarta '+label(first)+(poker?' al Poker Deck compartido.':' a su Power Deck.');
    const action=operation==='STEAL'?'Robo manual':operation==='DISCARD'?'Descarte manual':'Intercambio manual';
    for(const id of affected)logSim(id,action,desc+' ('+type+', '+(masked?'oculto':'visible')+').');
    sim.result=action+' · '+(playerB?'J'+playerA.playerNumber+' / J'+playerB.playerNumber:'J'+playerA.playerNumber);
    const owner=sim.decks[sim.activeIndex].id;
    // El snapshot global anterior ya conserva ambas manos y sus historiales.
    if(poker&&sim.mode==='ASSISTED')assistedLinks.cleanup();
    modal.picked=null;
    updateTradeView();toast(action+' registrado');
    return true;
  }
  function tradeDestination(side,index=null){

    return tradeApply(modal.picked.side,modal.picked.index,side,index);
  }

  function countIds(arr){return arr.reduce((o,id)=>(o[id]=(o[id]||0)+1,o),{})}
  function shuffle(arr){const a=[...arr],mode=state.randomizationSettings.mode;if(mode==='FAST')return fisher(a,false);if(mode==='SECURE')return fisher(a,true);let r=a;for(let i=0;i<3;i++)r=fisher(r,false);if(r.length>2){const cut=randomInt(r.length);r=r.slice(cut).concat(r.slice(0,cut));}return r}
  function fisher(a,secure){for(let i=a.length-1;i>0;i--){let j;if(sim?.seededRng)j=randomInt(i+1);else if(secure&&typeof crypto!=='undefined'&&crypto.getRandomValues){const x=new Uint32Array(1);crypto.getRandomValues(x);j=x[0]%(i+1)}else j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function randomInt(max){
    if(max<=1)return 0;
    if(sim?.seededRng)return Math.floor(sim.seededRng.next()*max);
    if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1);const limit=Math.floor(0x100000000/max)*max;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=limit);return x%max}
    return Math.floor(Math.random()*max);
  }
  function buildPokerDeck(deckCount=1){

    for(let copy=1;copy<=deckCount;copy++)for(const [suit,symbol,color] of suits)for(const rank of ranks)cards.push({id:`P${copy}-${suit}-${rank}`,rank,suit,symbol,color,copy});
    return cards;
  }

  // jsPDF core Helvetica has no Unicode glyph coverage for ⇄ and many symbols.
  // Keeping those characters produces a mixed UTF-16 string that extracts as
  // NUL-separated letters in PDF viewers. Convert only for PDF typography;
  // preserve original event text and UI unchanged.
  function pdfSafeText(value){
    const symbols={'⇄':' <-> ','→':' -> ','←':' <- ','↪':' -> ',
      '—':' - ','–':'-','…':'...', '♠':' picas ','♣':' treboles ',
      '♥':' corazones ','♦':' diamantes ','✓':' OK ','✕':' X ',
      '≥':'>=','≤':'<=','∞':'infinito','×':'x'};
    return String(value??'').replace(/[^\u0000-\u00FF]/g,ch=>symbols[ch]??' ');
  }

  function tradeTargetAt(x,y,origin){

    if(modal?.operation==='SWAP')return tile&&tile.dataset.side!==origin&&!tile.disabled?tile:null;
    if(modal?.operation==='STEAL'){
      const panel=at.closest('.trade-panel[data-trade-panel]');

    logSim(playerId,'CounterCard rival','J'+sim.decks.find(p=>p.id===playerId).playerNumber+' respondió a '+(getCard(pending.cardId)?.name||pending.cardId)+'.',getCard(cardId));
    sim.pendingHyper=null;delete sim.pendingHyperActivationCardId;sim.activeIndex=sim.turnIndex;

    }

      logSim(pending.actorId,'HyperCard bloqueada',sim.result,getCard(pending.cardId));render();return;

        (sim.mode!=='ASSISTED'||!assistedLinks?.protectedCard(pending.actorId,c)));
      if(allowed.length){const ix=allowed[randomInt(allowed.length)],gone=actor.pokerHand.splice(ix,1)[0];
        if(sim.mode==='ASSISTED')assistedLinks.onPokerOut(pending.actorId,[gone]);

        logSim(pending.actorId,'Tiro por la Culata','Descartó 1 Poker Card por la CounterCard del rival.',getCard(cardId));

    }
    activateReservedHyper(pending.at,true);
  }

      else manualRules.counterPass();
    }
    else if(a==='reference-press'){manualRules.pressReference(el.dataset.player)}
    else if(a==='reference-discard'){manualRules.discardReference(Number(el.dataset.index))}
    else if(a==='add-chips'){const {d,s}=currentSim(),add=Number(el.dataset.value||0),reason=el.dataset.reason||'Ajuste';if(['Par','Trío','Escalera','Color','Póker'].includes(reason)&&s.currentPhase!=='MAIN'){toast('Ese cobro solo está disponible durante Charge Phase.');return}pushUndo(d.id,'Ajuste de fichas');const before=Number(s.chips||0);s.chips=Math.max(0,before+add);const real=s.chips-before;sim.result=`${reason}: ${real>=0?'+':''}${real} · Total ${s.chips} fichas`;logSim(d.id,'Ajuste de fichas',`${reason}: ${real>=0?'+':''}${real} fichas. Total: ${s.chips}.`);render()}
    else if(a==='set-hand-size'){state.handSize=4;saveState();render()}
    else if(a==='set-random'){state.randomizationSettings.mode=el.dataset.value;saveState();render()}
    else if(a==='page-size'){state.printSettings.pageSize=el.dataset.value;saveState();render()}
    else if(a==='print-step'){const k=el.dataset.key,limits=k==='rows'?[1,6]:[1,5];state.printSettings[k]=Math.max(limits[0],Math.min(limits[1],state.printSettings[k]+(+el.dataset.delta)));saveState();render()}
    else if(a==='print-pdf')printDeck($('#exportDeck')?.value)
    else if(a==='export-json')downloadJSON(); else if(a==='import-json')$('#jsonPicker').click();
  });

  $('#imagePicker').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);if(!editingCard)editingCard=defaultCard();editingCard.image=canvas.toDataURL('image/jpeg',.88);editingCard.mediaMode='IMAGE';editingCard.tintEnabled=false;editingCard.tintStrength=0;if(e.target.dataset.mode==='new')go('cardEditor');else render();e.target.value=''};img.src=rd.result};rd.readAsDataURL(f)});
  $('#characterPicker').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data;try{data=canvas.toDataURL('image/webp',.78);if(!data.startsWith('data:image/webp'))data=canvas.toDataURL('image/jpeg',.78);}catch{data=canvas.toDataURL('image/jpeg',.78);}characterDraft={image:data,scale:1,focusX:50,focusY:50};modal={type:'character-edit'};render();e.target.value=''};img.src=rd.result};rd.readAsDataURL(f)});
  $('#jsonPicker').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.cards)||!Array.isArray(x.decks))throw Error();state={...defaultState(),...x,handSize:4,cards:x.cards.filter(c=>officialCardIds.has(c.id)||c.userCreated===true).map(c=>{const seed=starterCards.find(x=>x.id===c.id);return seed?{...c,name:seed.name,description:seed.description,accentColor:seed.accentColor,asset:'',image:'',userCreated:false}:c;}),decks:x.decks.map(d=>normalizeDeck(d)),testHistory:Array.isArray(x.testHistory)?x.testHistory:[]};saveState();toast('Datos importados');go('home')}catch{toast('JSON no válido')}e.target.value=''};rd.readAsText(f)});
  function downloadJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='deck_creator_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  async function printDeck(deckId){
    const d=getDeck(deckId);if(!d||!d.cardIds.length){toast('El deck está vacío');return false}
    const filename=`${safeFileName(d.name)}.pdf`,target=await requestPdfHandle(filename);if(target.cancelled){toast('Guardado cancelado');return false}const JsPDF=await ensurePdfTools(true);if(!JsPDF||!window.html2canvas)return false;
    try{toast('Generando PDF…');const p=state.printSettings,pdf=new JsPDF({unit:'mm',format:p.pageSize==='LETTER'?'letter':'a4',orientation:'portrait',compress:true}),pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),margin=Number(p.marginMm||10),gap=Number(p.gapMm||4),cols=Math.max(1,Number(p.columns||3)),rows=Math.max(1,Number(p.rows||3)),cellW=(pageW-margin*2-gap*(cols-1))/cols,cellH=(pageH-margin*2-gap*(rows-1))/rows,ratio=.72;let drawW=cellW,drawH=drawW/ratio;if(drawH>cellH){drawH=cellH;drawW=drawH*ratio}const cache=new Map(),cards=d.cardIds.map(getCard).filter(Boolean),per=cols*rows;for(let i=0;i<cards.length;i++){if(i>0&&i%per===0)pdf.addPage();const c=cards[i];let data=cache.get(c.id);if(!data){data=await renderCardForPdf(c);cache.set(c.id,data)}const pos=i%per,col=pos%cols,row=Math.floor(pos/cols),x=margin+col*(cellW+gap)+(cellW-drawW)/2,y=margin+row*(cellH+gap)+(cellH-drawH)/2;pdf.addImage(data,'JPEG',x,y,drawW,drawH,undefined,'FAST')}return await savePdfDocument(pdf,filename,target.handle)}catch(e){console.error(e);toast('No se pudo generar el PDF');return false}
  }



  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal()}});
  render();
  } catch (err) {
    console.error('POKER BLITZ boot error', err);
    const host=document.querySelector('#app');
    if(host){
      const msg=String(err && (err.stack||err.message||err) || 'Error desconocido');
      host.innerHTML='<main style="min-height:100vh;padding:32px;font-family:Arial,sans-serif;background:#f8f9fa;color:#101214"><section style="max-width:850px;margin:40px auto;background:#fff;border:2px solid #101214;border-radius:16px;padding:24px"><h1 style="margin-top:0">POKER BLITZ no pudo iniciar</h1><p>La aplicación encontró un error al restaurar esta sesión. Tus datos locales no han sido borrados.</p><pre style="white-space:pre-wrap;background:#f2f4f5;border-radius:10px;padding:12px;overflow:auto">'+msg.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</pre><button onclick="location.reload()" style="padding:12px 18px;border:2px solid #101214;border-radius:10px;background:#18E0E5;font-weight:800;cursor:pointer">Reintentar</button></section></main>';
    }
  }
})();
