<script>
(() => {
  'use strict';
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const root = $('#app');
  const STORAGE_KEY = 'deck-creator:web:v1';
  const palette = ['#18E0E5','#7BE495','#FFE052','#FF945A','#F56B94','#B77BEA','#FFFFFF','#222222'];
  let screen = 'home';
  let selectedCardId = null;
  let editingCard = null;
  let editingDeckId = null;
  let modal = null;
  let libraryQuery = '';
  let deckQuery = '';
  let addQuery = '';

  const APP_VERSION = '1.7.0';
  const RULES_SECTIONS = [
    {title:'1. Objetivo', html:`<p>Obtén la meta de fichas antes que los demás jugadores para reclamar el poder de la <b>Mano Imposible</b>. La meta depende del modo de juego.</p><p>Cuando un jugador alcanza la meta, la partida no termina inmediatamente: se completa la ronda actual hasta que todos hayan tenido el mismo número de turnos y luego se comparan las fichas.</p>`},
    {title:'2. Tipos de cartas', html:`<h4>2.1 Poker Cards</h4><p>Son las cartas utilizadas para formar combinaciones de póker y obtener fichas.</p><p><b>Límite base de Poker Cards: 7.</b> Este límite indica cuántas cartas puedes conservar al terminar tu turno; no impide robar por encima de ese número durante el turno.</p><h4>2.2 Power Cards</h4><p>Son las cartas que modifican el juego.</p><div class="rules-table-wrap"><table class="rules-table"><thead><tr><th>Tipo</th><th>Color</th><th>Función</th></tr></thead><tbody><tr><td>SuperCards</td><td>Celeste</td><td>Efectos rápidos que activas durante tu Main Phase.</td></tr><tr><td>CounterCards</td><td>Rojo / magenta</td><td>Efectos rápidos de respuesta durante la Main Phase rival.</td></tr><tr><td>HyperCards</td><td>Amarillo</td><td>Efectos persistentes que permanecen activos sobre la mesa.</td></tr></tbody></table></div><p>Una HyperCard activada sale de tu mano y se coloca frente a ti sobre la mesa. Mientras esté activa no cuenta como una Power Card en mano.</p><p>El documento indica en esta sección un límite de <b>3 HyperCards activas</b> por jugador.</p>`},
    {title:'3. Construcción del Power Deck', html:`<p>Cada jugador construye su propio Power Deck con entre <b>25 y 30 Power Cards</b>, combinando SuperCards, CounterCards e HyperCards, salvo restricciones particulares del formato o de una carta.</p><ul><li>Tamaño del Power Deck: 25 a 30 cartas.</li><li>Límite base de Power Cards en mano: 4.</li><li>Límite base de Poker Cards conservadas al final del turno: 7.</li><li>Límite de HyperCards activas sobre la mesa: 5.</li></ul>`},
    {title:'4. Reciclaje de cartas', html:`<p>Poker Blitz reutiliza las cartas durante la partida. Las cartas usadas o descartadas vuelven a sus respectivos decks, salvo que un efecto indique lo contrario.</p><ul><li>Poker Cards utilizadas para cobrar, descartadas por efectos, por costes o por exceder el límite vuelven al Poker Deck.</li><li>SuperCards y CounterCards usadas vuelven al Power Deck de su propietario.</li><li>Power Cards descartadas como coste también vuelven al Power Deck de su propietario.</li><li>HyperCards activadas permanecen en la mesa; si son destruidas, devueltas o abandonan el campo, vuelven al Power Deck de su propietario.</li></ul>`},
    {title:'5. Preparación', html:`<p>La mano inicial depende del modo de juego. Ningún jugador realiza Draw Phase durante su primer turno.</p>`},
    {title:'6. Fases del turno', html:`<h4>6.1 Draw Phase</h4><p>Roba hasta 3 Power Cards nuevas, sin superar tu límite actual de Power Cards en mano.</p><p>Ejemplo con límite 4: con 4 cartas robas 0; con 3 robas 1; con 2 robas 2; con 1 o 0 robas hasta 3.</p><h4>6.2 Main Phase</h4><p>Puedes jugar todas las Power Cards que quieras, siempre que cumplas los costes, condiciones y límites de activación de sus efectos.</p><ul><li>Activa SuperCards.</li><li>Activa HyperCards y colócalas sobre la mesa.</li><li>Paga costes, realiza intercambios, tiradas de dados y demás acciones autorizadas.</li><li>Cuando termines, debes declarar el final de tu Main Phase.</li></ul>`},
    {title:'7. Límites de activación de efectos', html:`<p>Los textos del tipo <b>“Hasta 2 veces por turno”</b> limitan el efecto, no cada copia individual de la carta.</p><p>Ese efecto puede resolverse como máximo 2 veces durante ese turno, aunque tengas 3 copias de la carta o uses Espejador Experto para copiarlo. Los límites se comparten entre todas las copias del mismo efecto y sus copias generadas por otros efectos.</p>`},
    {title:'8. CounterCards y cadenas', html:`<p>Durante la Main Phase de un jugador, los rivales pueden responder con CounterCards cuando sus condiciones lo permitan. Puede haber varias respuestas consecutivas, incluso una negación de una negación.</p><ol><li>Un jugador activa un efecto.</li><li>Otro jugador responde con una CounterCard.</li><li>Pueden añadirse nuevas CounterCards sucesivamente.</li><li>Cuando nadie quiera añadir otra, la cadena se cierra.</li><li>La cadena se resuelve desde el último efecto jugado hasta el primero.</li><li>Una vez iniciada la resolución, no pueden agregarse nuevos efectos a esa cadena.</li></ol>`},
    {title:'9. Charge Phase y sistema de cobro', html:`<p>Durante tu Charge Phase puedes cobrar todas las combinaciones válidas que puedas formar con tus Poker Cards. Cada Poker Card solo puede pertenecer a una combinación cobrada durante esa Charge Phase.</p><div class="rules-table-wrap"><table class="rules-table compact"><thead><tr><th>Combinación</th><th>Fichas</th></tr></thead><tbody><tr><td>Pareja</td><td>1</td></tr><tr><td>Trío</td><td>3</td></tr><tr><td>Escalera de 5</td><td>5</td></tr><tr><td>Color de 5</td><td>5</td></tr><tr><td>Póker</td><td>7</td></tr></tbody></table></div><p>No existe “doble pareja” como categoría independiente: cada pareja se cobra por separado. Tampoco existe full house como categoría independiente: un trío y una pareja se cobran como dos combinaciones distintas, siempre que no compartan cartas.</p>`},
    {title:'10. Después de cobrar', html:`<ol><li>Recibes las fichas correspondientes.</li><li>Las Poker Cards utilizadas vuelven al Poker Deck.</li><li>Registras cuántas Poker Cards utilizaste para cobrar.</li><li>Las cartas de reemplazo no se roban inmediatamente; se reponen en tu End Phase.</li></ol><p>Las Poker Cards obtenidas como reposición no pueden generar nuevas combinaciones durante la Charge Phase que las originó.</p>`},
    {title:'11. End Phase', html:`<p>La End Phase se resuelve en este orden:</p><h4>11.1 Reposición de Charge</h4><p>Roba 1 Poker Card por cada Poker Card utilizada para cobrar combinaciones durante tu Charge Phase. Solo las cartas utilizadas para cobrar se reponen automáticamente.</p><h4>11.2 Efectos de End Phase</h4><p>Resuelve todos los efectos que indiquen expresamente que ocurren durante tu End Phase.</p><h4>11.3 Ajuste de mano</h4><p>Después de resolver la reposición y los demás efectos, si tienes más Poker Cards que tu límite actual, descarta cartas de tu elección hasta cumplirlo. Las cartas descartadas por exceso vuelven al Poker Deck y no se reemplazan.</p>`},
    {title:'12. Robo por encima del límite de Poker Cards', html:`<p>El límite de Poker Cards nunca impide robar. Puedes superar temporalmente tu límite mediante efectos.</p><p>Ejemplo: si tienes 7/7 Poker Cards y activas un efecto que roba 3, pasas temporalmente a 10/7. Puedes utilizar esas 10 cartas durante el turno. En tu End Phase debes descartar hasta volver a tu límite.</p>`},
    {title:'13. Efectos que modifican límites', html:`<p>Cuando una carta aumenta tu límite de Poker Cards, modifica la cantidad que puedes conservar al final del turno. No impide superar temporalmente ese valor durante el turno.</p><p>Ejemplo: con límite 10 puedes llegar temporalmente a 12/10; al terminar tu turno debes quedar en 10 o menos.</p>`},
    {title:'14. Modos de juego', html:`<div class="rules-table-wrap"><table class="rules-table"><thead><tr><th>Modo</th><th>Power Cards iniciales</th><th>Poker Cards iniciales</th><th>Meta</th></tr></thead><tbody><tr><td>Blitz Battle</td><td>3</td><td>5</td><td>30 fichas</td></tr><tr><td>Rush Battle</td><td>4</td><td>7</td><td>15 fichas</td></tr></tbody></table></div><p><b>Blitz Battle:</b> desarrollo más gradual, con mayor espacio para HyperCards y motores de largo plazo.</p><p><b>Rush Battle:</b> inicio explosivo, más cartas disponibles desde el comienzo y una meta más baja.</p>`},
    {title:'15. Fin del juego', html:`<ul><li>Cuando un jugador alcance la meta durante una ronda, la ronda continúa hasta el último jugador.</li><li>Al finalizar la ronda se comparan las fichas de todos los jugadores.</li><li>Gana el jugador con más fichas; no necesariamente quien alcanzó primero la meta.</li><li>Si hay empate por el primer lugar, solo los jugadores empatados continúan.</li><li>Se juegan hasta 3 rondas adicionales como máximo. Si el empate continúa, se declara empate total.</li></ul>`},
    {title:'16. Referencia rápida', html:`<div class="rules-table-wrap"><table class="rules-table quick"><tbody><tr><th>Power Deck</th><td>25–30 Power Cards</td></tr><tr><th>Límite base de Power Cards en mano</th><td>4</td></tr><tr><th>Draw Phase</th><td>Hasta 3 Power Cards nuevas</td></tr><tr><th>Límite base de Poker Cards al final del turno</th><td>7</td></tr><tr><th>HyperCards activas simultáneas</th><td>Máximo 5</td></tr><tr><th>Main Phase</th><td>Juega todas las Power Cards que quieras</td></tr><tr><th>Charge Phase</th><td>Cobra todas las combinaciones independientes posibles</td></tr><tr><th>End Phase</th><td>Reposición → efectos → ajuste de mano</td></tr></tbody></table></div>`}
  ];

  const defaultCard = () => ({
    id: crypto.randomUUID(), name:'NUEVA CARTA', description:'Escribe aquí el efecto o descripción de la carta.',
    accentColor:'#18DDE1', cardBackgroundColor:'#F1F1F1', mediaMode:'IMAGE', image:null,

    return `<main class="sim-shell"><div class="sim-top"><button class="icon-btn" data-action="exit-sim">${icon('back')}</button><h1>Modo prueba</h1><div class="sim-result">${esc(sim.result||'')}</div><span class="sim-hand-size">Inicial: ${state.handSize}</span><strong>${sim.activeIndex+1} / ${valid.length}</strong></div><div class="sim-tools"><button class="nav-deck" data-action="prev-sim">${icon('left','lg')}</button><div class="deck-summary">${icon('cards','xl')}<div><div class="name">${esc(d.name)}</div><div class="small muted">${s.drawPile.length} restantes · ${s.hand.length} en mano</div></div></div><button class="nav-deck" data-action="next-sim">${icon('right','lg')}</button><div class="game-tools"><button class="tool-action" data-action="die">${icon('dice','lg')}1 dado</button><button class="tool-action" data-action="two-dice">${icon('dice','lg')}2 dados</button><button class="tool-action" data-action="coin">${icon('coin','lg')}Moneda</button><div class="vertical-divider"></div><div class="counter-block"><span>Contadores</span><div class="counter-step"><button data-action="counter-minus">−</button><strong>${s.counter}</strong><button data-action="counter-plus">+</button></div></div></div></div><div class="sim-hand">${s.hand.length?s.hand.map((id,i)=>{const c=getCard(id);if(!c)return'';const locked=s.locked.includes(i);return `<article class="hand-card ${locked?'locked':''}"><div class="hand-preview-wrap" data-action="zoom-card" data-id="${c.id}">${cardHTML(c)}<div class="lock-badge">${icon(locked?'lock':'unlock')}</div></div><div class="hand-actions"><button class="btn primary" data-action="use-card" data-index="${i}" ${locked?'disabled':''}>${icon('play')} Usar</button><button class="btn" data-action="toggle-lock" data-index="${i}">${icon(locked?'unlock':'lock')}</button></div></article>`}).join(''):`<div class="empty" style="width:100%">La mano está vacía. Roba una carta si quedan cartas en el deck.</div>`}</div><div class="sim-bottom"><button class="btn primary draw" data-action="draw-card" ${s.drawPile.length?'':'disabled'}>${icon('plus')} Robar carta</button><div class="hint">Toca una carta para ampliarla. Usa el candado para bloquearla o desbloquearla. Al salir puedes guardar un reporte PDF del historial.</div></div></main>`;
  }

  function renderRules(){
    return `<main class="app-shell rules-shell">${appBar('Reglamento oficial',{back:true})}<section class="rules-wrap"><div class="rules-hero panel"><div><div class="eyebrow">POKER BLITZ</div><h2>Reglamento Oficial</h2><p>Edición base · Documento de reglas</p></div><div class="rules-version">Web v${APP_VERSION}</div></div><div class="rules-grid">${RULES_SECTIONS.map((r,i)=>`<article class="rule-card panel"><div class="rule-number">${String(i+1).padStart(2,'0')}</div><div class="rule-body"><h3>${r.title}</h3>${r.html}</div></article>`).join('')}</div><div class="rules-note">El texto se incorporó desde el reglamento oficial adjunto. Se conserva la diferencia interna del documento sobre el límite de HyperCards: la sección 2 menciona 3, mientras que las secciones 3 y 16 indican 5.</div></section></main>`;

  function renderSettings(){const m=state.randomizationSettings.mode;return `<main class="app-shell">${appBar('Configuración',{back:true})}<section class="settings-wrap"><div class="panel pad"><h2 style="font-size:23px;margin:0">Cartas iniciales</h2><p class="small muted">Elige cuántas Power Cards se reparten al entrar al modo prueba. El cambio se aplica la próxima vez que inicies o reinicies la prueba.</p><div class="hand-size-options">${[3,4,5].map(n=>`<button class="hand-size-btn ${state.handSize===n?'selected':''}" data-action="set-hand-size" data-value="${n}"><strong>${n}</strong><span>cartas</span></button>`).join('')}</div></div><div class="panel pad"><h2 style="font-size:23px;margin:0">Randomización del deck</h2><p class="small muted">Este ajuste controla cómo se baraja el deck antes de repartir y cómo se vuelven a mezclar las cartas consumidas.</p>${settingOpt('FAST','1. Rápido','Una mezcla estándar. Es la opción más veloz y suficiente para pruebas rápidas.',m)}${settingOpt('MIXED','2. Mezcla intensa','Hace tres pasadas de mezcla y un corte aleatorio. Da una sensación de barajado más agresiva.',m)}${settingOpt('SECURE','3. Seguro','Usa crypto.getRandomValues y Fisher–Yates. Es la opción más impredecible de las tres.',m)}</div><div class="note">Nota: una mezcla Fisher–Yates correcta ya puede producir una distribución uniforme. El modo Seguro mejora sobre todo la impredecibilidad del generador aleatorio.</div></section></main>`}
  function settingOpt(value,title,desc,current){return `<button class="setting-option ${current===value?'selected':''}" data-action="set-random" data-value="${value}"><input type="radio" ${current===value?'checked':''} tabindex="-1"><div><b>${esc(title)}</b><span class="small muted">${esc(desc)}</span></div></button>`}
  function renderExport(){

    return `<main class="app-shell">${appBar('Exportar',{back:true})}<section class="export-wrap"><div class="export-grid"><div class="export-panel"><div class="export-head">${icon('pdf','lg')} Imprimir en PDF</div><div class="export-content"><p class="muted">Genera una vista de impresión con tus cartas. En el diálogo del navegador elige “Guardar como PDF”.</p><div class="field"><label>Deck</label><select id="exportDeck">${state.decks.length?state.decks.map(x=>`<option value="${x.id}" ${d&&x.id===d.id?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">Sin decks</option>'}</select></div><div class="editor-row" style="margin:12px 0"><strong>Tamaño</strong><button class="btn ${p.pageSize==='A4'?'primary':''}" data-action="page-size" data-value="A4">A4</button><button class="btn ${p.pageSize==='LETTER'?'primary':''}" data-action="page-size" data-value="LETTER">Letter</button></div><div class="range-grid"><div>${numStepper('Filas',p.rows,'rows',1,6)}</div><div>${numStepper('Columnas',p.columns,'columns',1,5)}</div></div><div class="range-wrap" style="margin-top:12px"><label>Espacio entre cartas ${Math.round(p.gapMm)} mm</label><input id="gapMm" type="range" min="0" max="20" step="1" value="${p.gapMm}"><label>Margen ${Math.round(p.marginMm)} mm</label><input id="marginMm" type="range" min="0" max="25" step="1" value="${p.marginMm}"></div><button class="btn primary" style="width:100%;margin-top:12px" data-action="print-pdf" ${state.decks.length?'':'disabled'}>${icon('pdf')} Generar PDF</button></div></div><div class="export-panel"><div class="export-head">${icon('cards','lg')} Vista previa</div><div class="export-content"><div class="print-grid-preview">${paperPreview(p.rows,p.columns)}</div></div></div></div><div class="export-panel"><div class="export-head">${icon('cards','lg')} Respaldo JSON</div><div class="export-content"><p class="muted">Incluye todas tus cartas, decks, imágenes y configuraciones guardadas en esta versión web.</p><div class="range-grid"><button class="btn" style="height:64px" data-action="export-json">${icon('upload')} Exportar JSON</button><button class="btn" style="height:64px" data-action="import-json">${icon('download')} Importar JSON</button></div></div></div></section></main>`;
  }
  function numStepper(label,value,key,min,max){return `<div><b>${label}</b><div class="stepper" style="height:46px;margin-top:6px"><button data-action="print-step" data-key="${key}" data-delta="-1" ${value<=min?'disabled':''}>−</button><strong style="flex:1;width:auto">${value}</strong><button data-action="print-step" data-key="${key}" data-delta="1" ${value>=max?'disabled':''}>+</button></div></div>`}
  function paperPreview(r,c){return `<div class="paper" style="grid-template-columns:repeat(${c},1fr);grid-template-rows:repeat(${r},1fr)">${Array.from({length:r*c},()=>'<div class="paper-cell"></div>').join('')}</div>`}
  function renderModal(){
    if(!modal)return'';
    if(modal.type==='zoom'){const c=getCard(modal.id);return c?`<div class="modal-backdrop" data-action="modal-backdrop"><div class="zoom-shell"><button class="icon-btn zoom-close" data-action="close-modal" title="Cerrar">${icon('close')}</button><div class="zoom-card">${cardHTML(c)}</div></div></div>`:''}
    if(modal.type==='exit-sim'){return `<div class="modal-backdrop"><div class="modal exit-modal"><div class="modal-head"><h2>¿Salir del modo prueba?</h2><button class="icon-btn" data-action="close-modal">${icon('close')}</button></div><div class="modal-content"><p>Puedes salir directamente o guardar primero un PDF con el historial de cada deck. El reporte incluye las cartas jugadas junto con su descripción.</p><div class="exit-actions"><button class="btn primary" data-action="exit-with-report">${icon('pdf')} Salir con PDF</button><button class="btn" data-action="exit-without-report">Salir sin PDF</button><button class="btn soft" data-action="close-modal">Cancelar</button></div></div></div></div>`}
    if(modal.type==='add'){
      const deck=getDeck(editingDeckId); const counts=countIds(deck?.cardIds||[]),f=state.cards.filter(c=>c.name.toLowerCase().includes(addQuery.toLowerCase())); const total=deck?.cardIds?.length||0;
      return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Añadir carta</h2><button class="icon-btn" data-action="close-modal">${icon('close')}</button></div><div class="modal-content"><div class="search" style="height:58px">${icon('search')}<input id="addSearch" value="${esc(addQuery)}" placeholder="Buscar carta"></div><div class="add-summary"><span>Total actual del deck</span><span>${total} cartas</span></div><div class="add-list" style="margin-top:10px">${f.map(c=>`<div class="add-row"><div class="thumb" data-action="zoom-card" data-id="${c.id}">${cardHTML(c)}</div><div class="info"><b>${esc(c.name)}</b><span class="small muted">Cantidad en el deck</span></div><button class="icon-btn" data-action="zoom-card" data-id="${c.id}" title="Ampliar">${icon('zoom')}</button><div class="mini-stepper"><button data-action="deck-minus-modal" data-id="${c.id}" ${(counts[c.id]||0)<=0?'disabled':''}>${icon('minus')}</button><strong>${counts[c.id]||0}</strong><button data-action="add-card-to-deck" data-id="${c.id}">${icon('plus')}</button></div></div>`).join('')}</div><div class="modal-note">Consejo: al ampliar una carta y cerrarla, volverás a este mismo panel sin perder la búsqueda ni el contexto.</div></div></div></div>`;
    }
    return'';
  }
  function bindInputs(){
    $('#librarySearch')?.addEventListener('input',e=>{libraryQuery=e.target.value;render()});
    $('#deckSearch')?.addEventListener('input',e=>{deckQuery=e.target.value;render()});
    $('#addSearch')?.addEventListener('input',e=>{addQuery=e.target.value;render()});
    $('#cardName')?.addEventListener('input',e=>{editingCard.name=e.target.value.slice(0,40);renderEditorSoft()});
    $('#cardDesc')?.addEventListener('input',e=>{editingCard.description=e.target.value.slice(0,350);renderEditorSoft()});
    for(const [id,key,conv] of [['imageInset','imageInsetFraction',Number],['imageScale','imageScale',Number],['imageX','imageOffsetX',Number],['imageY','imageOffsetY',Number],['tintStrength','tintStrength',Number]]) $('#'+id)?.addEventListener('input',e=>{editingCard[key]=conv(e.target.value);renderEditorSoft()});
    $('#tintEnabled')?.addEventListener('change',e=>{editingCard.tintEnabled=e.target.checked;renderEditorSoft()});
    $('#deckName')?.addEventListener('input',e=>{const d=getDeck(editingDeckId);d.name=e.target.value.slice(0,50);saveState();const h=$('.topbar h1');if(h)h.textContent='Deck: '+d.name;});
    $('#gapMm')?.addEventListener('input',e=>{state.printSettings.gapMm=+e.target.value;saveState();render()});
    $('#marginMm')?.addEventListener('input',e=>{state.printSettings.marginMm=+e.target.value;saveState();render()});
  }
  function renderEditorSoft(){
    const preview=$('.preview-panel');if(preview)preview.innerHTML=cardHTML(editingCard);
    const nameHelp=$('#cardName')?.nextElementSibling;if(nameHelp)nameHelp.textContent=editingCard.name.length+'/40';
    const descHelp=$('#cardDesc')?.nextElementSibling;if(descHelp)descHelp.textContent=editingCard.description.length+'/350';
  }
  function countIds(arr){return arr.reduce((o,id)=>(o[id]=(o[id]||0)+1,o),{})}
  function shuffle(arr){const a=[...arr],mode=state.randomizationSettings.mode;if(mode==='FAST')return fisher(a,false);if(mode==='SECURE')return fisher(a,true);let r=a;for(let i=0;i<3;i++)r=fisher(r,false);if(r.length>2){const cut=Math.floor(Math.random()*r.length);r=r.slice(cut).concat(r.slice(0,cut));}return r}
  function fisher(a,secure){for(let i=a.length-1;i>0;i--){let j;if(secure&&crypto?.getRandomValues){const x=new Uint32Array(1);crypto.getRandomValues(x);j=x[0]%(i+1)}else j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function randomInt(max){
    if(max<=1)return 0;
    if(crypto?.getRandomValues){const a=new Uint32Array(1);const limit=Math.floor(0x100000000/max)*max;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=limit);return x%max}
    return Math.floor(Math.random()*max);
  }
  function initSim(initialDeckId=null){
    const valid=state.decks.filter(d=>d.cardIds.length),initialIndex=Math.max(0,valid.findIndex(d=>d.id===initialDeckId));
    sim={activeIndex:initialIndex,result:'Listo para jugar',states:{},histories:{},startedAt:Date.now()};
    for(const d of valid){const sh=shuffle(d.cardIds),n=Math.min(state.handSize,sh.length),hand=sh.slice(0,n);sim.states[d.id]={initialCards:d.cardIds.length,drawPile:sh.slice(n),hand,locked:[],counter:0};sim.histories[d.id]=hand.map(cid=>{const c=getCard(cid);return {at:Date.now(),action:'Carta inicial',detail:'Carta repartida en la mano inicial.',cardName:c?.name||'',cardDescription:c?.description||''}})}
  }
  function currentSim(){const valid=state.decks.filter(d=>d.cardIds.length),d=valid[sim.activeIndex%valid.length];return {valid,d,s:sim.states[d.id]}}
  function logSim(deckId,action,detail='',card=null){if(!sim?.histories)return;(sim.histories[deckId]??=[]).push({at:Date.now(),action,detail,cardName:card?.name||'',cardDescription:card?.description||''})}
  function toolResult(action,result){const {d}=currentSim();sim.result=result;logSim(d.id,action,result)}
  function simulationReportHTML(){
    const valid=state.decks.filter(d=>d.cardIds.length),stamp=new Date();
    const decks=valid.map((d,di)=>{const st=sim.states[d.id],events=sim.histories[d.id]||[];return `<section class="report-deck"><h2>${di+1}. ${esc(d.name)}</h2><p><b>Inicio:</b> ${st.initialCards} cartas · <b>Final:</b> ${st.drawPile.length} en deck, ${st.hand.length} en mano · <b>Contador:</b> ${st.counter}</p>${events.length?`<ol>${events.map(ev=>`<li><div><b>[${new Date(ev.at).toLocaleTimeString()}] ${esc(ev.action)}</b></div>${ev.detail?`<div>${esc(ev.detail)}</div>`:''}${ev.cardName?`<div><b>Carta:</b> ${esc(ev.cardName)}</div>`:''}${ev.cardDescription?`<div><b>Descripción:</b> ${esc(ev.cardDescription)}</div>`:''}</li>`).join('')}</ol>`:'<p>Sin acciones registradas.</p>'}</section>`}).join('');
    return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>POKER BLITZ · Reporte de modo prueba</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#101214;margin:0;font-size:11pt}header{border-bottom:3px solid #18E0E5;padding-bottom:8px;margin-bottom:16px}h1{font-size:22pt;margin:0}h2{font-size:15pt;margin:18px 0 6px}.meta{color:#555}.report-deck{break-inside:avoid}li{margin:0 0 10px;padding-left:2px;line-height:1.35}@media print{button{display:none}}</style></head><body><header><h1>POKER BLITZ · Reporte de modo prueba</h1><div class="meta">Fecha: ${stamp.toLocaleString()} · Decks registrados: ${valid.length}</div></header>${decks}<script>onload=()=>setTimeout(()=>print(),250)<\/script></body></html>`
  }
  function printSimulationReport(){const w=open('','_blank');if(!w){toast('El navegador bloqueó la ventana del reporte');return false}w.document.write(simulationReportHTML());w.document.close();return true}

  root.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
    if(a==='back'){if(screen==='cardEditor'||screen==='deckEditor'||screen==='cards'||screen==='decks'||screen==='settings'||screen==='export')go('home');else go('home')}
    else if(a==='settings')go('settings'); else if(a==='rules')go('rules'); else if(a==='all-cards')go('cards'); else if(a==='all-decks')go('decks'); else if(a==='export')go('export'); else if(a==='simulator'){sim=null;go('simulator')}
    else if(a==='new-card'){editingCard=defaultCard();$('#imagePicker').dataset.mode='new';$('#imagePicker').click()}
    else if(a==='pick-image'){$('#imagePicker').dataset.mode='replace';$('#imagePicker').click()}
    else if(a==='edit-card'){editingCard=structuredClone(getCard(id));go('cardEditor')}
    else if(a==='select-card'){selectedCardId=id;render()}
    else if(a==='zoom-card'){const ret=modal?structuredClone(modal):null;if(ret?.type==='add')ret.scrollTop=$('.add-list')?.scrollTop||0;modal={type:'zoom',id,returnTo:ret};render()}
    else if(a==='close-modal'||a==='modal-backdrop'){closeModal()}
    else if(a==='delete-card'){if(confirm('¿Eliminar esta carta? También se quitará de los decks.')){state.cards=state.cards.filter(c=>c.id!==id);state.decks=state.decks.map(d=>({...d,cardIds:d.cardIds.filter(x=>x!==id)}));saveState();render()}}
    else if(a==='set-color'){editingCard.accentColor=el.dataset.color;editingCard.tintColor=el.dataset.color;render()}
    else if(a==='recenter'){Object.assign(editingCard,{imageScale:1,imageOffsetX:0,imageOffsetY:0,imageInsetFraction:.03});render()}
    else if(a==='save-card'){const i=state.cards.findIndex(c=>c.id===editingCard.id);if(i>=0)state.cards[i]=structuredClone(editingCard);else state.cards.push(structuredClone(editingCard));saveState();toast('Carta guardada');go('home')}
    else if(a==='duplicate-card'){const cp={...structuredClone(editingCard),id:crypto.randomUUID(),name:(editingCard.name+' COPIA').slice(0,40),userCreated:true};state.cards.push(cp);saveState();editingCard=cp;toast('Carta duplicada');render()}
    else if(a==='new-deck'){const d={id:crypto.randomUUID(),name:'Nuevo deck',cardIds:[]};state.decks.push(d);saveState();editingDeckId=d.id;go('deckEditor')}
    else if(a==='open-deck'){editingDeckId=id;deckQuery='';go('deckEditor')}
    else if(a==='delete-deck'){e.stopPropagation();if(confirm('¿Eliminar este deck?')){state.decks=state.decks.filter(d=>d.id!==id);saveState();render()}}
    else if(a==='deck-plus'){getDeck(editingDeckId).cardIds.push(id);saveState();render()}
    else if(a==='deck-minus'){const d=getDeck(editingDeckId),i=d.cardIds.indexOf(id);if(i>=0)d.cardIds.splice(i,1);saveState();render()}
    else if(a==='deck-minus-modal'){const top=$('.add-list')?.scrollTop||0,d=getDeck(editingDeckId),i=d.cardIds.indexOf(id);if(i>=0)d.cardIds.splice(i,1);saveState();renderAddPreservingScroll(top)}
    else if(a==='add-card-modal'){addQuery='';modal={type:'add'};render()}
    else if(a==='add-card-to-deck'){const top=$('.add-list')?.scrollTop||0;getDeck(editingDeckId).cardIds.push(id);saveState();renderAddPreservingScroll(top)}
    else if(a==='test-deck'){initSim(editingDeckId);go('simulator')}
    else if(a==='exit-sim'){modal={type:'exit-sim'};render()}
    else if(a==='exit-with-report'){if(printSimulationReport()){sim=null;modal=null;go('home')}}
    else if(a==='exit-without-report'){sim=null;modal=null;go('home')}
    else if(['prev-sim','next-sim'].includes(a)){const {valid}=currentSim();sim.activeIndex=(sim.activeIndex+(a==='next-sim'?1:-1)+valid.length)%valid.length;render()}
    else if(a==='draw-card'){const {d,s}=currentSim();if(s.drawPile.length){const cid=s.drawPile.shift(),c=getCard(cid);s.hand.push(cid);logSim(d.id,'Robar carta','La carta fue robada del deck y añadida a la mano.',c);render()}}
    else if(a==='use-card'){const {d,s}=currentSim(),i=+el.dataset.index;if(s.locked.includes(i))return;const [cid]=s.hand.splice(i,1),c=getCard(cid);s.drawPile=shuffle([...s.drawPile,cid]);s.locked=s.locked.filter(x=>x!==i).map(x=>x>i?x-1:x);logSim(d.id,'Usar carta','La carta fue usada y regresó al deck.',c);render()}
    else if(a==='toggle-lock'){const {d,s}=currentSim(),i=+el.dataset.index,was=s.locked.includes(i),c=getCard(s.hand[i]);s.locked=was?s.locked.filter(x=>x!==i):[...s.locked,i];logSim(d.id,was?'Desbloquear carta':'Bloquear carta',was?'La carta volvió a estar disponible para usar.':'La carta quedó bloqueada y no puede usarse hasta desbloquearla.',c);render()}
    else if(a==='die'){toolResult('Lanzamiento de 1 dado','Resultado del dado: '+(1+randomInt(6)));render()}
    else if(a==='two-dice'){const x=1+randomInt(6),y=1+randomInt(6);toolResult('Lanzamiento de 2 dados',`Dado 1: ${x} · Dado 2: ${y} · Total: ${x+y}`);render()}
    else if(a==='coin'){toolResult('Moneda','Moneda: '+(randomInt(2)===0?'Cara':'Cruz'));render()}
    else if(a==='counter-minus'){const {d,s}=currentSim(),before=s.counter;s.counter=Math.max(0,s.counter-1);if(s.counter!==before)logSim(d.id,'Disminuir contador',`Contador del deck: ${before} → ${s.counter} (cambio -1).`);render()}
    else if(a==='counter-plus'){const {d,s}=currentSim(),before=s.counter;s.counter++;logSim(d.id,'Aumentar contador',`Contador del deck: ${before} → ${s.counter} (cambio +1).`);render()}
    else if(a==='set-hand-size'){state.handSize=Math.max(3,Math.min(5,+el.dataset.value||5));saveState();render()}
    else if(a==='set-random'){state.randomizationSettings.mode=el.dataset.value;saveState();render()}
    else if(a==='page-size'){state.printSettings.pageSize=el.dataset.value;saveState();render()}
    else if(a==='print-step'){const k=el.dataset.key,limits=k==='rows'?[1,6]:[1,5];state.printSettings[k]=Math.max(limits[0],Math.min(limits[1],state.printSettings[k]+(+el.dataset.delta)));saveState();render()}
    else if(a==='print-pdf')printDeck($('#exportDeck')?.value)
    else if(a==='export-json')downloadJSON(); else if(a==='import-json')$('#jsonPicker').click();
  });

  $('#imagePicker').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);if(!editingCard)editingCard=defaultCard();editingCard.image=canvas.toDataURL('image/jpeg',.88);editingCard.mediaMode='IMAGE';editingCard.tintEnabled=false;editingCard.tintStrength=0;if(e.target.dataset.mode==='new')go('cardEditor');else render();e.target.value=''};img.src=rd.result};rd.readAsDataURL(f)});
  $('#jsonPicker').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.cards)||!Array.isArray(x.decks))throw Error();state={...defaultState(),...x,handSize:[3,4,5].includes(Number(x.handSize))?Number(x.handSize):5};saveState();toast('Datos importados');go('home')}catch{toast('JSON no válido')}e.target.value=''};rd.readAsText(f)});
  function downloadJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='deck_creator_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  function printDeck(deckId){
    const d=getDeck(deckId);if(!d||!d.cardIds.length){toast('El deck está vacío');return}
    const cards=d.cardIds.map(getCard).filter(Boolean),p=state.printSettings,w=open('','_blank');
    if(!w){toast('El navegador bloqueó la ventana de impresión');return}
    const atlasUrl=new URL('assets/starter_cards_atlas.webp',location.href).href;
    const cells=cards.map(c=>`<div class="print-card">${cardHTML(c).replaceAll("assets/starter_cards_atlas.webp",atlasUrl)}</div>`).join('');
    const cardCss=`*{box-sizing:border-box}.card-preview{position:relative;aspect-ratio:.72;width:100%;background:#F1F1F1;border:2px solid #000;border-radius:3.5%;padding:2.1%;overflow:hidden;display:flex;flex-direction:column;gap:1.25%;container-type:inline-size;color:#101214;font-family:Arial,sans-serif}.card-title{height:10.5%;min-height:10.5%;background:var(--accent);border:1px solid #000;border-radius:6%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:5.35cqw;line-height:1;padding:1.5% 4%;overflow:hidden;text-transform:uppercase}.card-media{height:43%;min-height:43%;border-radius:3%;position:relative;overflow:hidden;background:#F1F1F1}.card-media-inner{position:absolute;inset:var(--inset,3%);border:2px solid var(--accent);border-radius:3%;overflow:hidden;background:#eee}.card-media img{width:100%;height:100%;transform:translate(var(--ox,0%),var(--oy,0%)) scale(var(--zoom,1));transform-origin:center;display:block;filter:var(--filter,none);object-fit:cover}.card-media .atlas-art{position:relative;width:100%;height:100%;overflow:hidden;transform:translate(var(--ox,0%),var(--oy,0%)) scale(var(--zoom,1));transform-origin:center;filter:var(--filter,none)}.card-media .atlas-art img.atlas-sprite{position:absolute;display:block;width:800%;height:700%;max-width:none;max-height:none;transform:none!important;filter:none!important;object-fit:fill}.card-divider{height:1.4%;min-height:3px;background:var(--accent);margin:0 -1.4%}.card-desc{flex:1;background:#fff;border:2px solid #000;outline:1.5px solid var(--accent);outline-offset:-3px;border-radius:3%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;padding:4%;font-size:4.4cqw;line-height:1.17;overflow:hidden}.small-text .card-desc{font-size:3.85cqw}.tiny-text .card-desc{font-size:3.55cqw;line-height:1.13}`;
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(d.name)}</title><style>@page{size:${p.pageSize==='LETTER'?'Letter':'A4'};margin:${p.marginMm}mm}html,body{margin:0;padding:0;background:#fff}${cardCss}.sheet{display:grid;grid-template-columns:repeat(${p.columns},minmax(0,1fr));gap:${p.gapMm}mm;align-items:start}.print-card{break-inside:avoid;page-break-inside:avoid;width:100%;aspect-ratio:.72}.print-card .card-preview{height:100%;width:100%}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="sheet">${cells}</div><script>window.addEventListener('load',()=>{const imgs=[...document.images];Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true})}))).then(()=>setTimeout(()=>window.print(),250));});<\/script></body></html>`);
    w.document.close();
  }


  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal()}});
  render();
})();

</script>
