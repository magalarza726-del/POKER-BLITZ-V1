<script>
(() => {
  'use strict';
  try {
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const root = $('#app');
  const STORAGE_KEY = 'deck-creator:web:v1';
  const palette = ['#18E0E5','#7BE495','#FFE052','#FF945A','#F56B94','#B77BEA','#FFFFFF','#222222'];
  let screen = 'home';
  let selectedCardId = null;
  let editingCard = null;
  let editingDeckId = null;
  let modal = null;
  let libraryQuery = '';
  let deckQuery = '';
  let addQuery = '';
  let libraryTypeFilter = 'ALL';
  let deckTypeFilter = 'ALL';
  let addTypeFilter = 'ALL';
  let sim = null;
  let toastTimer;
  let characterDraft = null;

  const APP_VERSION = '1.18.5';
  const RULES_SECTIONS = [
    {title:'1. Objetivo', html:`<p>Obtén la meta de fichas antes que los demás jugadores para reclamar el poder de la <b>Mano Imposible</b>. La meta depende del modo de juego.</p><p>Cuando un jugador alcanza la meta, la partida no termina inmediatamente: se completa la ronda actual hasta que todos hayan tenido el mismo número de turnos y luego se comparan las fichas.</p>`},
    {title:'2. Tipos de cartas', html:`<h4>2.1 Poker Cards</h4><p>Son las cartas utilizadas para formar combinaciones de póker y obtener fichas.</p><p><b>Límite base de Poker Cards: 7.</b> Este límite indica cuántas cartas puedes conservar al terminar tu turno; no impide robar por encima de ese número durante el turno.</p><h4>2.2 Power Cards</h4><p>Son las cartas que modifican el juego.</p><div class="rules-table-wrap"><table class="rules-table"><thead><tr><th>Tipo</th><th>Color</th><th>Función</th></tr></thead><tbody><tr><td>SuperCards</td><td>Celeste</td><td>Efectos rápidos que activas durante tu Main Phase.</td></tr><tr><td>CounterCards</td><td>Rojo / magenta</td><td>Efectos rápidos de respuesta durante la Main Phase rival.</td></tr><tr><td>HyperCards</td><td>Amarillo</td><td>Efectos persistentes que permanecen activos sobre la mesa.</td></tr></tbody></table></div><p>Una HyperCard activada sale de tu mano y se coloca frente a ti sobre la mesa. Mientras esté activa no cuenta como una Power Card en mano.</p><p>El documento indica en esta sección un límite de <b>3 HyperCards activas</b> por jugador.</p>`},
    {title:'3. Construcción del Power Deck', html:`<p>Cada jugador construye su propio Power Deck con entre <b>25 y 30 Power Cards</b>, combinando SuperCards, CounterCards e HyperCards, salvo restricciones particulares del formato o de una carta.</p><ul><li>Tamaño del Power Deck: 25 a 30 cartas.</li><li>Límite base de Power Cards en mano: 4.</li><li>Límite base de Poker Cards conservadas al final del turno: 7.</li><li>Límite de HyperCards activas sobre la mesa: 5.</li></ul>`},
    {title:'4. Reciclaje de cartas', html:`<p>Poker Blitz reutiliza las cartas durante la partida. Las cartas usadas o descartadas vuelven a sus respectivos decks, salvo que un efecto indique lo contrario.</p><ul><li>Poker Cards utilizadas para cobrar, descartadas por efectos, por costes o por exceder el límite vuelven al Poker Deck.</li><li>SuperCards y CounterCards usadas vuelven al Power Deck de su propietario.</li><li>Power Cards descartadas como coste también vuelven al Power Deck de su propietario.</li><li>HyperCards activadas permanecen en la mesa; si son destruidas, devueltas o abandonan el campo, vuelven al Power Deck de su propietario.</li></ul>`},
    {title:'5. Preparación', html:`<p>La mano inicial depende del modo de juego. Ningún jugador realiza Draw Phase durante su primer turno.</p>`},
    {title:'6. Fases del turno', html:`<h4>6.1 Draw Phase</h4><p>Roba hasta 3 Power Cards nuevas, sin superar tu límite actual de Power Cards en mano.</p><p>Ejemplo con límite 4: con 4 cartas robas 0; con 3 robas 1; con 2 robas 2; con 1 o 0 robas hasta 3.</p><h4>6.2 Main Phase</h4><p>Puedes jugar todas las Power Cards que quieras, siempre que cumplas los costes, condiciones y límites de activación de sus efectos.</p><ul><li>Activa SuperCards.</li><li>Activa HyperCards y colócalas sobre la mesa.</li><li>Paga costes, realiza intercambios, tiradas de dados y demás acciones autorizadas.</li><li>Cuando termines, debes declarar el final de tu Main Phase.</li></ul>`},
    {title:'7. Límites de activación de efectos', html:`<p>Los textos del tipo <b>“Hasta 2 veces por turno”</b> limitan el efecto, no cada copia individual de la carta.</p><p>Ese efecto puede resolverse como máximo 2 veces durante ese turno, aunque tengas 3 copias de la carta o uses Espejador Experto para copiarlo. Los límites se comparten entre todas las copias del mismo efecto y sus copias generadas por otros efectos.</p>`},
    {title:'8. CounterCards y cadenas', html:`<p>Durante la Main Phase de un jugador, los rivales pueden responder con CounterCards cuando sus condiciones lo permitan. Puede haber varias respuestas consecutivas, incluso una negación de una negación.</p><ol><li>Un jugador activa un efecto.</li><li>Otro jugador responde con una CounterCard.</li><li>Pueden añadirse nuevas CounterCards sucesivamente.</li><li>Cuando nadie quiera añadir otra, la cadena se cierra.</li><li>La cadena se resuelve desde el último efecto jugado hasta el primero.</li><li>Una vez iniciada la resolución, no pueden agregarse nuevos efectos a esa cadena.</li></ol>`},
    {title:'9. Charge Phase y sistema de cobro', html:`<p>Durante tu Charge Phase puedes cobrar todas las combinaciones válidas que puedas formar con tus Poker Cards. Cada Poker Card solo puede pertenecer a una combinación cobrada durante esa Charge Phase.</p><div class="rules-table-wrap"><table class="rules-table compact"><thead><tr><th>Combinación</th><th>Fichas</th></tr></thead><tbody><tr><td>Pareja</td><td>1</td></tr><tr><td>Trío</td><td>3</td></tr><tr><td>Escalera de 5</td><td>5</td></tr><tr><td>Color de 5</td><td>5</td></tr><tr><td>Póker</td><td>7</td></tr></tbody></table></div><p>No existe “doble pareja” como categoría independiente: cada pareja se cobra por separado. Tampoco existe full house como categoría independiente: un trío y una pareja se cobran como dos combinaciones distintas, siempre que no compartan cartas.</p>`},
    {title:'10. Después de cobrar', html:`<ol><li>Recibes las fichas correspondientes.</li><li>Las Poker Cards utilizadas vuelven al Poker Deck.</li><li>Registras cuántas Poker Cards utilizaste para cobrar.</li><li>Las cartas de reemplazo no se roban inmediatamente; se reponen en tu End Phase.</li></ol><p>Las Poker Cards obtenidas como reposición no pueden generar nuevas combinaciones durante la Charge Phase que las originó.</p>`},
    {title:'11. End Phase', html:`<p>La End Phase se resuelve en este orden:</p><h4>11.1 Reposición de Charge</h4><p>Roba 1 Poker Card por cada Poker Card utilizada para cobrar combinaciones durante tu Charge Phase. Solo las cartas utilizadas para cobrar se reponen automáticamente.</p><h4>11.2 Efectos de End Phase</h4><p>Resuelve todos los efectos que indiquen expresamente que ocurren durante tu End Phase.</p><h4>11.3 Ajuste de mano</h4><p>Después de resolver la reposición y los demás efectos, si tienes más Poker Cards que tu límite actual, descarta cartas de tu elección hasta cumplirlo. Las cartas descartadas por exceso vuelven al Poker Deck y no se reemplazan.</p><h4>11.4 Ajuste de mano de Power Cards</h4><p>Después de ajustar la mano de Poker, puedes descartar tantas Power Cards como desees. Puedes hacer esto para reciclar cartas para más Adelante si no te sirven en el momento.</p>`},
    {title:'12. Robo por encima del límite de Poker Cards', html:`<p>El límite de Poker Cards nunca impide robar. Puedes superar temporalmente tu límite mediante efectos.</p><p>Ejemplo: si tienes 7/7 Poker Cards y activas un efecto que roba 3, pasas temporalmente a 10/7. Puedes utilizar esas 10 cartas durante el turno. En tu End Phase debes descartar hasta volver a tu límite.</p>`},
    {title:'13. Efectos que modifican límites', html:`<p>Cuando una carta aumenta tu límite de Poker Cards, modifica la cantidad que puedes conservar al final del turno. No impide superar temporalmente ese valor durante el turno.</p><p>Ejemplo: con límite 10 puedes llegar temporalmente a 12/10; al terminar tu turno debes quedar en 10 o menos.</p>`},
    {title:'14. Modos de juego', html:`<div class="rules-table-wrap"><table class="rules-table"><thead><tr><th>Modo</th><th>Power Cards iniciales</th><th>Poker Cards iniciales</th><th>Meta</th></tr></thead><tbody><tr><td>Blitz Battle</td><td>3</td><td>5</td><td>30 fichas</td></tr><tr><td>Rush Battle</td><td>4</td><td>7</td><td>15 fichas</td></tr></tbody></table></div><p><b>Blitz Battle:</b> desarrollo más gradual, con mayor espacio para HyperCards y motores de largo plazo.</p><p><b>Rush Battle:</b> inicio explosivo, más cartas disponibles desde el comienzo y una meta más baja.</p>`},
    {title:'15. Fin del juego', html:`<ul><li>Cuando un jugador alcance la meta durante una ronda, la ronda continúa hasta el último jugador.</li><li>Al finalizar la ronda se comparan las fichas de todos los jugadores.</li><li>Gana el jugador con más fichas; no necesariamente quien alcanzó primero la meta.</li><li>Si hay empate por el primer lugar, solo los jugadores empatados continúan.</li><li>Se juegan hasta 3 rondas adicionales como máximo. Si el empate continúa, se declara empate total.</li></ul>`},
    {title:'16. Referencia rápida', html:`<div class="rules-table-wrap"><table class="rules-table quick"><tbody><tr><th>Power Deck</th><td>25–30 Power Cards</td></tr><tr><th>Límite base de Power Cards en mano</th><td>4</td></tr><tr><th>Draw Phase</th><td>Hasta 3 Power Cards nuevas</td></tr><tr><th>Límite base de Poker Cards al final del turno</th><td>7</td></tr><tr><th>HyperCards activas simultáneas</th><td>Máximo 5</td></tr><tr><th>Main Phase</th><td>Juega todas las Power Cards que quieras</td></tr><tr><th>Charge Phase</th><td>Cobra todas las combinaciones independientes posibles</td></tr><tr><th>End Phase</th><td>Reposición → efectos → ajuste de mano</td></tr></tbody></table></div>`}
  ];

      {id:'deck_demo_mixto',name:'Demo Mixto',cardIds:mixed,iconCardId:null,characterImage:null,characterScale:1,characterFocusX:50,characterFocusY:50,description:'Deck de prueba con mezcla de categorías.'}

  function normalizeDeck(d){
    const ids=Array.isArray(d?.cardIds)?d.cardIds:[];
    return {...d,cardIds:ids,iconCardId:null,characterImage:typeof d?.characterImage==='string'&&d.characterImage?d.characterImage:null,characterScale:Math.max(1,Math.min(3,Number(d?.characterScale)||1)),characterFocusX:Math.max(0,Math.min(100,Number.isFinite(Number(d?.characterFocusX))?Number(d.characterFocusX):50)),characterFocusY:Math.max(0,Math.min(100,Number.isFinite(Number(d?.characterFocusY))?Number(d.characterFocusY):50)),description:String(d?.description||'').slice(0,180)};
  }

  function loadState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return defaultState();
      const saved=JSON.parse(raw), base=defaultState();
      const handSize=[3,4,5].includes(Number(saved.handSize))?Number(saved.handSize):5;
      const starterById=new Map(starterCards.map(c=>[c.id,c]));
      const savedCards=Array.isArray(saved.cards)?saved.cards:[];
      const migratedCards=savedCards.map(c=>{
        const seed=starterById.get(c.id);
        if(!seed) return c;
        const img=String(c.image||'');
        const isCustomImage=img.startsWith('data:image/jpeg')||img.startsWith('data:image/png')||img.startsWith('data:image/gif')||img.startsWith('blob:')||/^https?:\/\//i.test(img);
        const preserveCustom=isCustomImage && !img.startsWith('data:image/webp;base64,');
        return {
          ...c,
          name:seed.name,
          description:seed.description,
          accentColor:seed.accentColor,
          asset:seed.asset,
          image:preserveCustom?c.image:seed.image,
          userCreated:false,
          tintColor:c.tintColor||seed.accentColor
        };
      });
      const present=new Set(migratedCards.map(c=>c.id));
      for(const seed of starterCards) if(!present.has(seed.id)) migratedCards.push(structuredClone(seed));
      return {
        ...base,...saved,
        handSize,
        cards:migratedCards,
        decks:(Array.isArray(saved.decks)?saved.decks:base.decks).map(d=>normalizeDeck(d)),
        printSettings:{...base.printSettings,...saved.printSettings},
        randomizationSettings:{...base.randomizationSettings,...saved.randomizationSettings},
        testHistory:Array.isArray(saved.testHistory)?saved.testHistory:[],
        starterCatalogVersion:9
      };
    }catch(e){console.error(e);return defaultState();}
  }
  function compactStateForStorage(){
    const seedById=new Map(starterCards.map(c=>[c.id,c]));
    const compactCards=(state.cards||[]).map(c=>{
      const seed=seedById.get(c.id);if(!seed)return c;
      const out={
        id:c.id,
        cardBackgroundColor:c.cardBackgroundColor||'#F1F1F1',
        mediaMode:c.mediaMode||'IMAGE',
        tintEnabled:!!c.tintEnabled,
        tintColor:c.tintColor||seed.accentColor,
        tintStrength:Number(c.tintStrength||0),
        imageScale:Number(c.imageScale||1),
        imageOffsetX:Number(c.imageOffsetX||0),
        imageOffsetY:Number(c.imageOffsetY||0),
        imageInsetFraction:Number(c.imageInsetFraction??.03),
        userCreated:false
      };
      const img=String(c.image||'');
      const seedImg=String(seed.image||seed.asset||'');
      const isCustom=img && img!==seedImg && img!==String(seed.asset||'') && (img.startsWith('data:image/')||img.startsWith('blob:')||/^https?:\/\//i.test(img));
      if(isCustom)out.image=img;
      return out;
    });
    return {...state,cards:compactCards};
  }
  function saveState(){
    const payload=compactStateForStorage();
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));return true;}
    catch(err){
      console.warn('No se pudo guardar el estado completo.',err);
      if(Array.isArray(payload.testHistory)&&payload.testHistory.length>12){
        try{const reduced={...payload,testHistory:payload.testHistory.slice(0,12)};localStorage.setItem(STORAGE_KEY,JSON.stringify(reduced));return true;}catch(_e){}
      }
      toast('No hay espacio para guardar. Reduce imágenes o exporta un JSON.');
      return false;
    }
  }

  function appBar(title,{back=false,logo=false,settings=false}={}){return `<div class="topbar ${logo?'':'compact'}">${back?`<button class="icon-btn" data-action="back">${icon('back')}</button>`:''}${logo?`<div class="brand-badge" aria-label="Poker Blitz">PB</div>`:''}<h1>${esc(title)}</h1>${settings?`<button class="icon-btn" data-action="settings">${icon('settings','lg')}</button>`:''}</div>`}
  function builtinArtIndex(card){
    const refs=[card?.asset,card?.image].map(v=>String(v||''));
    for(const ref of refs){
      const m=ref.match(/(?:^|\/)(\d{3})_[^/]+\.jpg(?:$|[?#])/i) || ref.match(/^(\d{3})_[^/]+\.jpg$/i);
      if(m){const n=Number(m[1]);if(n>=1&&n<=56)return n-1;}
    }
    const id=String(card?.id||'').match(/catalog_v3_(\d{3})/i);
    if(id){const n=Number(id[1]);if(n>=1&&n<=56)return n-1;}
    return -1;
  }
  function atlasArtHTML(card,ox,oy,zoom,tint){
    const idx=builtinArtIndex(card);if(idx<0)return'';
    const col=idx%8,row=Math.floor(idx/8);
    return `<div class="atlas-art" aria-hidden="true" style="--ox:${ox};--oy:${oy};--zoom:${zoom};--filter:${tint}"><img class="atlas-sprite" src="assets/starter_cards_atlas.webp" alt="" style="left:-${col*100}%;top:-${row*100}%"></div>`;
  }
  function hasCustomArt(card){
    const img=String(card?.image||'');
    if(!img)return false;
    if(img.startsWith('blob:')||/^https?:\/\//i.test(img))return true;
    if(img.startsWith('data:image/jpeg')||img.startsWith('data:image/png')||img.startsWith('data:image/gif'))return true;
    return false;
  }
  function cardHTML(card, extra=''){
    const dl=(card.description||'').length; const descClass=dl>240?'tiny-text':dl>200?'small-text':'';
    const img=card.image||card.asset||''; const tint=card.tintEnabled&&card.tintStrength>0?`sepia(1) saturate(4) hue-rotate(${hueFromHex(card.tintColor)}deg) opacity(${1-card.tintStrength*.15})`: 'none';
    const inset=(Number(card.imageInsetFraction??.03)*100).toFixed(1)+'%';
    const ox=(Number(card.imageOffsetX||0)*35).toFixed(1)+'%'; const oy=(Number(card.imageOffsetY||0)*35).toFixed(1)+'%'; const zoom=Number(card.imageScale||1);
    const builtIn=builtinArtIndex(card)>=0&&!hasCustomArt(card);
    const media=builtIn?atlasArtHTML(card,ox,oy,zoom,tint):(img?`<img src="${esc(img)}" alt="" style="--ox:${ox};--oy:${oy};--zoom:${zoom};--filter:${tint}">`:'');
    return `<div class="card-preview ${descClass} ${extra}" style="--accent:${esc(card.accentColor||'#18E0E5')};background:${esc(card.cardBackgroundColor||'#F1F1F1')}"><div class="card-title">${esc(card.name)}</div><div class="card-media"><div class="card-media-inner" style="--inset:${inset}">${media}</div></div><div class="card-divider"></div><div class="card-desc">${esc(card.description)}</div></div>`;
  }
  function hueFromHex(hex){if(!/^#[0-9a-f]{6}$/i.test(hex||''))return 0;const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(!d)return 0;let h=max===r?((g-b)/d)%6:max===g?(b-r)/d+2:(r-g)/d+4;return Math.round(h*60<0?h*60+360:h*60)-50;}
  function getCard(id){return state.cards.find(c=>c.id===id)} function getDeck(id){return state.decks.find(d=>d.id===id)}
  function cardType(card){const c=String(card?.accentColor||'').toUpperCase();if(['#FFC31A','#FFE052','#FFCC00','#F9B900'].includes(c))return 'HYPER';if(['#FF0A68','#F56B94','#E6005C','#FF006E'].includes(c))return 'COUNTER';return 'SUPER'}
  function cardTypeLabel(card){return cardType(card)==='HYPER'?'HyperCard':cardType(card)==='COUNTER'?'CounterCard':'SuperCard'}
  function typeMatches(card,filter){return !filter||filter==='ALL'||cardType(card)===filter}
  function typeFilterOptions(selected){return [['ALL','Todas'],['SUPER','SuperCards'],['COUNTER','CounterCards'],['HYPER','HyperCards']].map(([v,l])=>`<option value="${v}" ${selected===v?'selected':''}>${l}</option>`).join('')}

  function deckCharacterPhoto(deck,cls='character-photo'){
    if(!deck?.characterImage)return '';
    const scale=Math.max(1,Math.min(3,Number(deck.characterScale)||1)),fx=Math.max(0,Math.min(100,Number(deck.characterFocusX)||50)),fy=Math.max(0,Math.min(100,Number(deck.characterFocusY)||50));
    return `<div class="${cls}" style="--char-scale:${scale};--fx:${fx}%;--fy:${fy}%"><img src="${esc(deck.characterImage)}" alt="Personaje de ${esc(deck.name||'deck')}"></div>`;
  }
  function deckCharacterHTML(deck,cls='deck-avatar'){return deck?.characterImage?`<div class="${cls}">${deckCharacterPhoto(deck)}</div>`:`<div class="${cls}">${icon('game','lg')}</div>`}

  function render(){
    const maps={home:renderHome,cards:renderCards,decks:renderDecks,cardEditor:renderCardEditor,deckEditor:renderDeckEditor,simulator:renderSimulator,settings:renderSettings,export:renderExport,rules:renderRules};
    root.innerHTML=(maps[screen]||renderHome)()+renderModal();

  function renderHome(){
    const cards=state.cards.slice(0,8),decks=state.decks.slice(0,3);

eba</b><span>Jugar con tus cartas</span></div></button><button class="quick-action" data-action="test-history">${icon('cards','lg')}<div><b>Historial</b><span>Pruebas anteriores</span></div></button><button class="quick-action" data-action="export">${icon('swap','lg')}<div><b>Importar / Exportar</b><span>Guardar o compartir</span></div></button></section></main>`;

ass="editor-box"><div class="editor-row"><h3 style="margin:0">Filtro</h3><label style="display:flex;align-items:center;gap:7px"><input id="tintEnabled" type="checkbox" ${c.tintEnabled?'checked':''}> Aplicar tinte</label><div class="range-wrap" style="flex:1"><label>Intensidad ${Math.round((c.tintStrength||0)*100)}%</label><input id="tintStrength" type="range" min="0" max="1" step="0.01" value="${c.tintStrength||0}"></div></div></div><div class="editor-footer"><button class="btn primary" data-action="save-card">${icon('save')} Guardar</button><button class="btn" data-action="duplicate-card">${icon('copy')} Duplicar</button></div></div></section></main>`;

ide><section class="deck-right"><div class="deck-list-head"><h2>Cartas del deck (${d.cardIds.length})</h2><div class="search">${icon('search')}<input id="deckSearch" value="${esc(deckQuery)}" placeholder="Buscar cartas..."></div><select id="deckTypeFilter" class="type-filter">${typeFilterOptions(deckTypeFilter)}</select><button class="btn primary" data-action="add-card-modal">${icon('plus')} Añadir carta</button></div><div class="deck-card-list">${unique.length?unique.map(c=>deckCardRow(c,counts[c.id])).join(''):`<div class="empty" style="grid-column:1/-1">${d.cardIds.length?'No hay coincidencias.':'Añade cartas al deck.'}</div>`}</div></section></section></main>`;

  function deckCardRow(c,count){return `<div class="deck-card-item"><div class="deck-card-thumb" data-action="zoom-card" data-id="${c.id}">${cardHTML(c)}</div><div class="deck-card-name">${esc(c.name)}</div><button class="icon-btn" data-action="zoom-card" data-id="${c.id}">${icon('zoom')}</button><div class="stepper"><button data-action="deck-minus" data-id="${c.id}">${icon('minus')}</button><strong>${count}</strong><button data-action="deck-plus" data-id="${c.id}">${icon('plus')}</button></div></div>`}
  function renderSimulator(){
    if(!sim) initSim(); const valid=state.decks.filter(d=>d.cardIds.length); if(!valid.length)return `<main class="app-shell">${appBar('Modo prueba',{back:true})}<div class="empty" style="margin:auto;max-width:650px">No hay decks con cartas. Crea un deck y añade cartas para usar el modo prueba.</div></main>`;
    const d=valid[sim.activeIndex%valid.length];const s=sim.states[d.id];
    s.powerHandLimit=Number.isFinite(Number(s.powerHandLimit))?Math.max(0,Number(s.powerHandLimit)):4;
    s.currentPhase=s.currentPhase||'MAIN';
    const handCount=powerHandCount(s),overLimit=handCount>s.powerHandLimit;
    const dieValue=Number(s.dieBase||1),adjusted=dieValue+Number(s.dieModifier||0),finalTransform=dieTransform(dieValue);
    const dieFaces=[1,2,3,4,5,6].map(n=>`<div class="die-face f${n}">${n}</div>`).join('');
    const phaseButtons=[['DRAW','Draw Phase'],['MAIN','Main Phase'],['CHARGE','Charge Phase'],['END','End Phase']].map(([v,label])=>`<button class="phase-btn ${s.currentPhase===v?'active':''}" data-action="set-phase" data-phase="${v}">${label}</button>`).join('');
    const comboReasons=new Set(['Par','Trío','Escalera','Color','Póker']);
    const chipButtons=[[-1,'−1','Ajuste −1'],[1,'+1 efecto','Efecto'],[2,'+2 efecto','Efecto'],[1,'+1 par','Par'],[3,'+3 trío','Trío'],[5,'+5 escalera','Escalera'],[5,'+5 color','Color'],[7,'+7 póker','Póker']].map(([v,label,reason])=>`<button class="${Number(v)<0?'negative':''}" data-action="add-chips" data-value="${v}" data-reason="${reason}" ${comboReasons.has(reason)&&s.currentPhase!=='CHARGE'?'disabled title="Disponible solo durante Charge Phase"':''}>${label}</button>`).join('');
    const canUse=s.currentPhase==='MAIN',canDiscard=s.currentPhase==='MAIN'||s.currentPhase==='END',canActivate=s.currentPhase==='MAIN';
    const undoCount=(sim.undoStacks?.[d.id]||[]).length;
    return `<main class="sim-shell"><div class="sim-top"><button class="icon-btn" data-action="exit-sim">${icon('back')}</button><h1>Modo prueba</h1><div class="sim-result">${esc(sim.result||'')}</div><div class="sim-top-tools"><button class="sim-undo-btn" data-action="undo-action" title="Deshacer última acción" ${undoCount?'':'disabled'}>${icon('undo')}</button><button class="sim-history-btn" data-action="test-history">Historial</button></div><span class="sim-hand-size">Inicial: ${state.handSize}</span><strong>${sim.activeIndex+1} / ${valid.length}</strong></div><div class="phase-strip"><span class="phase-strip-label">Fase actual</span>${phaseButtons}</div><div class="sim-tools"><button class="nav-deck" data-action="prev-sim">${icon('left','lg')}</button><div class="deck-summary">${deckCharacterHTML(d,'deck-row-avatar')}<div><div class="name">${esc(d.name)}</div><div class="small muted">${s.drawPile.length} restantes · ${s.hand.length} visibles · ${handCount}/${s.powerHandLimit} Power Hand${s.activeHyper.length?' · '+s.activeHyper.length+'/3 Hyper activas':''}</div></div></div><button class="nav-deck" data-action="next-sim">${icon('right','lg')}</button><div class="game-tools"><div class="limit-panel"><div><div class="limit-title">Límite Power Hand</div><div class="limit-value ${overLimit?'hand-over-limit':''}">${handCount} / ${s.powerHandLimit}</div></div><div class="limit-stepper"><button data-action="adjust-hand-limit" data-delta="-1" ${s.powerHandLimit<=0?'disabled':''}>−</button><button data-action="adjust-hand-limit" data-delta="1">+</button></div><div class="small muted">Hyper activas no cuentan.</div></div><div class="die-widget"><div class="die-scene ${s.dieRolling?'rolling':''}" data-action="roll-die" title="Tirar dado"><div class="die-cube ${s.dieRolling?'rolling':''}" style="--die-final:${finalTransform};${s.dieRolling?'':'transform:'+finalTransform}">${dieFaces}</div></div><div class="die-info"><span>Dado · toca para lanzar</span><div class="die-adjust"><button data-action="die-adjust" data-delta="-1" ${s.dieBase?'':'disabled'}>${icon('left')}</button><strong>${s.dieBase?adjusted:'—'}</strong><button data-action="die-adjust" data-delta="1" ${s.dieBase?'':'disabled'}>${icon('right')}</button></div></div></div><div class="chip-block"><span class="small">Cobro rápido</span><div class="chip-total">${s.chips||0} fichas</div><div class="chip-actions">${chipButtons}</div></div></div></div><div class="sim-content"><div class="sim-hand">${s.hand.length?s.hand.map((id,i)=>{const c=getCard(id);if(!c)return'';const type=cardType(c),active=type==='HYPER'&&s.activeHyper.includes(i);const primary=type==='HYPER'?`<button class="btn primary" data-action="activate-hyper" data-index="${i}" ${active||!canActivate?'disabled':''}>${icon('play')} ${active?'Activa':'Activar'}</button>`:`<button class="btn primary" data-action="use-card" data-index="${i}" ${canUse?'':'disabled'}>${icon('play')} Usar</button>`;return `<article class="hand-card ${active?'hyper-active':''}"><div class="hand-preview-wrap" data-action="zoom-card" data-id="${c.id}">${cardHTML(c)}${active?`<div class="active-badge">ACTIVA</div>`:''}</div><div class="hand-actions">${primary}<button class="btn discard" data-action="discard-card" data-index="${i}" ${canDiscard?'':'disabled'}>${icon('trash')} Descartar</button></div></article>`}).join(''):`<div class="empty" style="width:100%">La mano está vacía. Usa uno de los modos de robo si quedan cartas en el deck.</div>`}</div>${simCharacterHTML(d)}</div><div class="sim-bottom"><button class="btn primary draw draw-mode-btn" data-action="draw-random" ${s.drawPile.length&&handCount<s.powerHandLimit?'':'disabled'}>${icon('plus')} Robar al azar</button><button class="btn draw-view draw-mode-btn" data-action="draw-view" ${s.drawPile.length&&handCount<s.powerHandLimit?'':'disabled'}>${icon('cards')} Ver Deck</button><button class="btn history-bottom" data-action="test-history">Historial</button><div class="hint">Draw Phase roba automáticamente hasta 3 Power Cards sin superar el límite y pasa a Main Phase. Charge Phase bloquea las Power Cards; End Phase solo permite descartar.</div></div></main>`;
  }

  function renderSettings(){const m=state.randomizationSettings.mode;return `<main class="app-shell">${appBar('Configuración',{back:true})}<section class="settings-wrap"><div class="panel pad"><h2 style="font-size:23px;margin:0">Cartas iniciales</h2><p class="small muted">Elige cuántas Power Cards se reparten al entrar al modo prueba. El cambio se aplica la próxima vez que inicies o reinicies la prueba.</p><div class="hand-size-options">${[3,4,5].map(n=>`<button class="hand-size-btn ${state.handSize===n?'selected':''}" data-action="set-hand-size" data-value="${n}"><strong>${n}</strong><span>cartas</span></button>`).join('')}</div></div><div class="panel pad"><h2 style="font-size:23px;margin:0">Randomización del deck</h2><p class="small muted">Este ajuste controla cómo se baraja el deck antes de repartir y cómo se vuelven a mezclar las cartas consumidas.</p>${settingOpt('FAST','1. Rápido','Una mezcla estándar. Es la opción más veloz y suficiente para pruebas rápidas.',m)}${settingOpt('MIXED','2. Mezcla intensa','Hace tres pasadas de mezcla y un corte aleatorio. Da una sensación de barajado más agresiva.',m)}${settingOpt('SECURE','3. Seguro','Usa crypto.getRandomValues y Fisher–Yates. Es la opción más impredecible de las tres.',m)}</div><div class="note">Nota: una mezcla Fisher–Yates correcta ya puede producir una distribución uniforme. El modo Seguro mejora sobre todo la impredecibilidad del generador aleatorio.</div></section></main>`}

<button class="btn" style="height:64px" data-action="export-json">${icon('upload')} Exportar JSON</button><button class="btn" style="height:64px" data-action="import-json">${icon('download')} Importar JSON</button></div></div></div></section></main>`;

  function renderModal(){
    if(!modal)return'';
    if(modal.type==='zoom'){const c=getCard(modal.id);return c?`<div class="modal-backdrop" data-action="modal-backdrop"><div class="zoom-shell"><button class="icon-btn zoom-close" data-action="close-modal" title="Cerrar">${icon('close')}</button><div class="zoom-card">${cardHTML(c)}</div></div></div>`:''}
    if(modal.type==='exit-sim'){return `<div class="modal-backdrop"><div class="modal exit-modal"><div class="modal-head"><h2>¿Salir del modo prueba?</h2><button class="icon-btn" data-action="close-modal">${icon('close')}</button></div><div class="modal-content"><p>Puedes salir directamente o guardar primero un PDF con el historial de cada deck. El reporte incluye las cartas jugadas junto con su descripción.</p><div class="exit-actions"><button class="btn primary" data-action="exit-with-report">${icon('pdf')} Salir con PDF</button><button class="btn" data-action="exit-without-report">Salir sin PDF</button><button class="btn soft" data-action="close-modal">Cancelar</button></div></div></div></div>`}

  function downloadJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='deck_creator_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  async function printDeck(deckId){
    const d=getDeck(deckId);if(!d||!d.cardIds.length){toast('El deck está vacío');return false}
    const filename=`${safeFileName(d.name)}.pdf`,target=await requestPdfHandle(filename);if(target.cancelled){toast('Guardado cancelado');return false}const JsPDF=await ensurePdfTools(true);if(!JsPDF||!window.html2canvas)return false;
    try{toast('Generando PDF…');const p=state.printSettings,pdf=new JsPDF({unit:'mm',format:p.pageSize==='LETTER'?'letter':'a4',orientation:'portrait'}),pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),margin=Number(p.marginMm||10),gap=Number(p.gapMm||4),cols=Math.max(1,Number(p.columns||3)),rows=Math.max(1,Number(p.rows||3)),cellW=(pageW-margin*2-gap*(cols-1))/cols,cellH=(pageH-margin*2-gap*(rows-1))/rows,ratio=.72;let drawW=cellW,drawH=drawW/ratio;if(drawH>cellH){drawH=cellH;drawW=drawH*ratio}const cache=new Map(),cards=d.cardIds.map(getCard).filter(Boolean),per=cols*rows;for(let i=0;i<cards.length;i++){if(i>0&&i%per===0)pdf.addPage();const c=cards[i];let data=cache.get(c.id);if(!data){data=await renderCardForPdf(c);cache.set(c.id,data)}const pos=i%per,col=pos%cols,row=Math.floor(pos/cols),x=margin+col*(cellW+gap)+(cellW-drawW)/2,y=margin+row*(cellH+gap)+(cellH-drawH)/2;pdf.addImage(data,'JPEG',x,y,drawW,drawH,undefined,'FAST')}return await savePdfDocument(pdf,filename,target.handle)}catch(e){console.error(e);toast('No se pudo generar el PDF');return false}
  }



  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal()}});
  render();
  } catch (err) {
    console.error('POKER BLITZ boot error', err);
    const host=document.querySelector('#app');
    if(host){
      const msg=String(err && (err.stack||err.message||err) || 'Error desconocido');
      host.innerHTML='<main style="min-height:100vh;padding:32px;font-family:Arial,sans-serif;background:#f8f9fa;color:#101214"><section style="max-width:850px;margin:40px auto;background:#fff;border:2px solid #101214;border-radius:16px;padding:24px"><h1 style="margin-top:0">POKER BLITZ no pudo iniciar</h1><p>La aplicación encontró un error al restaurar esta sesión. Tus datos locales no han sido borrados.</p><pre style="white-space:pre-wrap;background:#f2f4f5;border-radius:10px;padding:12px;overflow:auto">'+msg.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</pre><button onclick="location.reload()" style="padding:12px 18px;border:2px solid #101214;border-radius:10px;background:#18E0E5;font-weight:800;cursor:pointer">Reintentar</button></section></main>';
    }
  }
})();
